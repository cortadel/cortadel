name: Docs site

# Builds the Starlight docs in website/ and deploys them to Cloudflare Pages.
# The build gates every PR; the deploy runs only on push to main and is skipped
# (never failed) unless the Cloudflare secrets are present.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: docs (build + deploy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Deploys only from a push to main. Skipped (exit 0, never failed) when the
      # Cloudflare secrets are absent, so the build still gates every PR.
      #   CLOUDFLARE_API_TOKEN   - scoped to "Cloudflare Pages: Edit"
      #   CLOUDFLARE_ACCOUNT_ID
      # Alternative to this step: connect the repo in the Cloudflare Pages dashboard
      # (build command `pnpm build`, output directory `website/dist`, root `website`).
      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets not set - skipping deploy (build above still gates the PR)."
            echo "Enable by adding CLOUDFLARE_API_TOKEN (Pages: Edit) + CLOUDFLARE_ACCOUNT_ID,"
            echo "or connect the repo via the Cloudflare Pages dashboard."
            exit 0
          fi
          pnpm dlx wrangler pages deploy dist --project-name=cortadel-docs --branch=main
