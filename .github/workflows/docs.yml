name: Docs site

# Builds the Starlight docs in website/ and deploys them to Cloudflare Pages.
# The build gates every PR; the deploy runs only on push to main and is skipped
# (never failed) unless the Cloudflare secrets are present.
#
# docs/** and README.md are included below so a change to either triggers *some* workflow —
# before this, they triggered nothing at all (dotnet.yml's paths cover sdk/spec/examples, not
# these). Note this is a coverage placeholder, not a real content link: website/src/content/docs/*
# is a separate, already-diverged copy (verified with `diff` — none of the five files are
# byte-identical to their root docs/ counterpart), so the build step here does not actually read
# or validate root docs/**/README.md content; it just re-runs the unrelated website build so the
# change isn't silently ungated.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: docs (build + deploy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      # --ignore-scripts: blocks lifecycle scripts (preinstall/install/postinstall) from any
      # dependency in the tree from running arbitrary code during install. Verified this doesn't
      # break anything here: website/package.json declares no scripts of its own besides the astro
      # CLI wrappers (build/dev/preview), and its one native-code dependency, sharp, ships prebuilt
      # per-platform binaries as ordinary optionalDependencies (e.g. @img/sharp-linux-x64) rather
      # than compiling via a postinstall hook — confirmed directly against website/pnpm-lock.yaml
      # (no `requiresBuild`/script markers on the sharp entry). Confirmed empirically too: a clean
      # `pnpm install --frozen-lockfile --ignore-scripts` followed by `pnpm build` succeeds
      # unchanged (10 pages built, Pagefind search index included).
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm build

      # Deploys only from a push to main. Skipped (exit 0, never failed) when the
      # Cloudflare secrets are absent, so the build still gates every PR.
      #   CLOUDFLARE_API_TOKEN   - scoped to "Cloudflare Pages: Edit"
      #   CLOUDFLARE_ACCOUNT_ID
      # Alternative to this step: connect the repo in the Cloudflare Pages dashboard
      # (build command `pnpm build`, output directory `website/dist`, root `website`).
      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets not set - skipping deploy (build above still gates the PR)."
            echo "Enable by adding CLOUDFLARE_API_TOKEN (Pages: Edit) + CLOUDFLARE_ACCOUNT_ID,"
            echo "or connect the repo via the Cloudflare Pages dashboard."
            exit 0
          fi
          pnpm dlx wrangler pages deploy dist --project-name=cortadel-docs --branch=main
