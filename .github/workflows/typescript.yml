name: TypeScript SDK

# Gates the TypeScript SDK: install + typecheck + unit tests + build, a check that the committed
# Kiota client hasn't drifted from spec/openapi.json, and a conformance suite run against a real
# server. Mirrors .github/workflows/dotnet.yml job-for-job; provisioning below is reused verbatim
# from that file rather than re-derived, per .superpowers/sdd/2026-08-11-dotnet-sdk-leg's hard-won
# findings and this leg's own task-4/5/6 report
# (C:\Users\Selet\source\repos\memforge\.superpowers\sdd\2026-08-11-typescript-sdk-leg\task-4-6-report.md).
#
# The conformance gate is split into two tiers because a bare `ghcr.io/cortadel/cortadel:latest`
# container needs a reachable Memgraph just to answer /api/health, and needs a *working* LLM +
# embedding provider (Ollama, ~9.6 GB of models) for anything that writes. HealthController returns
# 503 (not 200) whenever the database or embedding check fails, so a bare `curl -f` wait-loop cannot
# work — see conformance-base's health-gate step below.
#
# node-version is pinned to 20.x, the floor declared in sdk/typescript/package.json's
# `engines.node` — CI deliberately runs the oldest supported runtime, not whatever happens to be
# newest, so a Node-22-only API slipping into the facade or its tests fails here instead of at a
# consumer's older LTS.

on:
  push:
    branches: [main]
    # sdk-ts-v* namespaces this leg's release tags the same way dotnet.yml's sdk-dotnet-v* does, so
    # sdk-ts-v*/sdk-dotnet-v*/sdk-py-v* (Python leg, planned) each get their own tag prefix instead
    # of contending over a shared v* pattern where a bare "v1.0.0" wouldn't say which SDK it
    # releases.
    #
    # GitHub does NOT evaluate `paths` for tag pushes (confirmed against GitHub's own docs, and
    # matching dotnet.yml's own header comment): path filters only gate branch pushes. So this tag
    # pattern is the *only* gate on this trigger; a push of a tag matching sdk-ts-v* always runs
    # this workflow (including publish-npm's own `if:`, below), regardless of which paths the
    # tagged commit touched. That's intentional here: a release tag is inherently a deliberate act
    # (nobody accidentally creates and pushes a tag), unlike an ordinary commit to main.
    tags: ['sdk-ts-v*']
    paths:
      - 'sdk/typescript/**'
      - 'spec/**'
      - '.config/dotnet-tools.json'
      - '.github/workflows/typescript.yml'
  pull_request:
    paths:
      - 'sdk/typescript/**'
      - 'spec/**'
      - '.config/dotnet-tools.json'
      - '.github/workflows/typescript.yml'
  workflow_dispatch:
  # Weekly, so the LLM-dependent tier (conformance-full) still gets exercised even if nobody
  # remembers to dispatch it manually. Offset by six minutes from dotnet.yml's own `17 6 * * 1` so
  # the two workflows' scheduled runs don't queue GitHub-hosted runners at the exact same instant —
  # not load-bearing, just tidy. build/generation-drift/conformance-base are cheap and gate every
  # PR; this schedule exists only to drive the expensive ~9.6 GB-model tier in its absence.
  schedule:
    - cron: '23 6 * * 1'

# No workflow-level concurrency block: a single group covering the whole file would mean a new push
# cancels the *entire in-flight run*, including a same-run conformance-full job mid-download of
# ~9.6 GB of models. Each job below gets its own group instead, keyed by a literal per-job name
# (typescript-build-/-drift-/-conformance-base-/-conformance-full-/-publish-npm-<ref>), so no two
# distinct jobs ever contend with each other. Note: the group literal can't be keyed by github.job —
# that context is only populated within a job's `steps`, and is null anywhere else including a
# job-level `concurrency:` block (dotnet.yml's own header comment documents hitting this the hard
# way: an earlier revision of that file collapsed every job to the same empty-suffixed group). This
# keeps the original "a newer push on the same ref supersedes a redundant older run of the same job"
# behavior per-job, without one job's cancellation taking any other job down with it.

jobs:
  build:
    concurrency:
      group: typescript-build-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.x'
          cache: pnpm
          cache-dependency-path: sdk/typescript/pnpm-lock.yaml
      # --ignore-scripts: blocks lifecycle scripts (preinstall/install/postinstall) from any
      # dependency in the tree from running arbitrary code during install. Verified this doesn't
      # break anything here: sdk/typescript's own package.json declares no scripts, and
      # pnpm-lock.yaml's only borderline case (esbuild, listed only as vite's optional peer
      # dependency, pulled in transitively via vitest) never actually resolves as an installed
      # package in this lockfile — no `esbuild@<version>:` entry exists, only the peerDependencies
      # mention. Confirmed empirically too: a clean `pnpm install --frozen-lockfile --ignore-scripts`
      # followed by `tsc --noEmit`, `vitest run "test/"`, and `pnpm run build` all pass unchanged.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec tsc --noEmit
      # test/ only — conformance/ is exercised (skips-cleanly, exit 0, with nothing configured) by
      # this same command, but is gated for real by conformance-base/conformance-full below, which
      # provision a live server. Trailing slash matters: `vitest run test` would also match
      # conformance/conformance.test.ts (its filename contains the substring "test"); `test/` only
      # matches paths under the test/ directory. Verified locally: `pnpm exec vitest run "test/"`
      # runs exactly the 2 unit-test files (31 tests), not conformance/conformance.test.ts.
      - run: pnpm exec vitest run "test/"
      - run: pnpm run build

  generation-drift:
    concurrency:
      group: typescript-drift-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet tool restore
      # No `--additional-data false`: that flag was in this leg's original brief but turned out to
      # be a mistake (fix(sdk-ts) c80ccec) — it silently emitted CreateMemoryRequest_metadata,
      # HybridSearchResult_attributes, and ValidationProblemDetails_errors as empty interfaces with
      # no-op (de)serializers, dropping three fields the facade actually needs. The merged .NET leg
      # never passed that flag either (includeAdditionalData: true in both kiota-lock.json files),
      # so dropping it here keeps the two SDKs generating from identical settings, not just an
      # identical spec.
      #
      # --clean-output: without it, kiota only adds/overwrites files — it never deletes ones a
      # schema removal makes obsolete, which would leave an orphaned generated file that
      # regeneration itself can't detect (nothing to diff against). --clean-output wipes the output
      # directory before generating, so a removed schema/operation now shows up as a deletion in the
      # git-status check below, not silence — the same fix dotnet.yml's generation-drift job
      # carries, added for the identical reason (a stale ApiError.cs surviving the
      # ApiError -> ErrorResponse rename).
      #
      # Verified locally before writing this step: regenerating into a scratch directory with this
      # exact command reproduces the committed sdk/typescript/src/generated tree byte-for-byte
      # (only kiota-lock.json's descriptionLocation differs, and only because the scratch dir sits
      # at a different relative path from spec/openapi.json than the real checkout does — generating
      # in place, as this step does, does not have that artifact).
      - name: Regenerate from the committed contract
        run: |
          dotnet tool run kiota generate -l typescript -c CortadelApiClient \
            -d ./spec/openapi.json -o ./sdk/typescript/src/generated \
            --exclude-backward-compatible -m application/json --clean-output
      # `git diff --exit-code` is blind to *untracked* files — a new operation/schema in
      # spec/openapi.json makes Kiota emit a brand-new file under src/generated/, not a modification
      # to an existing one, and `git diff` never reports those. `git status --porcelain
      # --untracked-files=all` catches both modifications and additions; the same choice dotnet.yml
      # makes for its own Generated/ tree, for the same reason.
      - name: Fail if generated code drifted
        run: |
          drift="$(git status --porcelain --untracked-files=all -- sdk/typescript/src/generated)"
          if [ -n "$drift" ]; then
            echo "::error::Generated client differs from the committed contract (new/changed/deleted files). Regenerate and commit."
            echo "$drift"
            exit 1
          fi

  conformance-base:
    name: conformance (base tier — no LLM, no embeddings)
    concurrency:
      group: typescript-conformance-base-${{ github.ref }}
      cancel-in-progress: true
    # PR/push/manual; excluded from the weekly schedule, which exists only to drive
    # conformance-full.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.x'
          cache: pnpm
          cache-dependency-path: sdk/typescript/pnpm-lock.yaml
      # --ignore-scripts: see the build job's own comment on why this is safe here.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # The no-LLM tier needs only a reachable Memgraph (get()/list()/delete() all issue store
      # queries even for a lookup that finds nothing) and explicitly *no* LLM or embedding provider.
      #
      # No --experimental-enabled=text-search here (docker-compose.yml still carries it, for the
      # full tier's parity with the documented quickstart). Per dotnet.yml's own conformance-base
      # job: the freshly-pulled `:latest` memgraph-mage image rejects that flag outright ("ERROR:
      # failed validation of new value 'text-search' for flag 'experimental_enabled'") — text search
      # graduated OUT of experimental status as of Memgraph 3.6, so `text-search` is no longer a
      # valid member of the experimental-features enum and the flag now fails validation instead of
      # being a harmless no-op. That failure is fatal at startup, and memgraph never binds its Bolt
      # port. None of this tier's 4 tests touch text search, so the flag is dropped rather than
      # chasing the currently-valid enum spelling.
      - name: Start Memgraph
        run: |
          docker network create cortadel-ci
          docker run -d --name memgraph --network cortadel-ci -p 7687:7687 \
            memgraph/memgraph-mage:latest

      # A bare TCP connect to 127.0.0.1:7687 is a false-positive trap: `-p 7687:7687` makes Docker's
      # host-side port-publishing proxy accept the TCP handshake as soon as the port mapping exists,
      # regardless of whether memgraph itself ever binds 7687 *inside* the container — that path
      # never touches the actual process. dotnet.yml's own conformance-base job hit this for real:
      # memgraph's process had already died, yet a TCP check still reported "accepting connections"
      # instantly, because it was only ever talking to the docker-proxy, not memgraph.
      #
      # mgconsole ships inside memgraph-mage for exactly this reason: it speaks real Bolt, and
      # `docker exec` runs it from inside the container's own namespace, so it only succeeds once
      # memgraph can actually execute a query — not just once *something* answers a SYN. This is
      # Memgraph's own documented container health-check idiom (`echo 'RETURN 0;' | mgconsole`). The
      # loop below is a retry-with-poll-interval, not a blind sleep: no fixed wait is added, and it
      # exits the moment the query succeeds.
      - name: Wait for Memgraph to be genuinely ready (Bolt-level, not just TCP)
        run: |
          for i in $(seq 1 45); do
            if docker exec memgraph sh -c "echo 'RETURN 0;' | mgconsole" >/tmp/mg-check.log 2>&1; then
              echo "memgraph answers Bolt queries"
              exit 0
            fi
            echo "waiting for memgraph to answer a Bolt query ($i/45)..."
            sleep 2
          done
          echo "::error::memgraph never answered a Bolt query — last attempt's output:"
          cat /tmp/mg-check.log 2>/dev/null || true
          docker logs memgraph
          exit 1

      # Deliberately no MEMFORGE_Llm__*/MEMFORGE_Embedding__* — the base tier's provisioning
      # requirement is "no LLM provider, no embedding provider". MEMFORGE_Auth__Secret is left
      # unset (empty = open), matching docker-compose.yml's own local-dev default.
      - name: Start Cortadel
        run: |
          docker run -d --name cortadel --network cortadel-ci -p 3001:3001 \
            -e MEMFORGE_Database__Provider=memgraph \
            -e MEMFORGE_Memgraph__Url=bolt://memgraph:7687 \
            ghcr.io/cortadel/cortadel:latest

      # HealthController legitimately returns 503 here — there is no embedding provider — and the
      # conformance suite's health() test asserts `ok | degraded` for exactly this reason. A bare
      # `curl -f` wait-loop would treat that 503 as failure and burn its full timeout without a
      # single test ever running.
      #
      # But status-code-only gating (200 or 503, accept-any-503) is exactly as blind as `curl -f` in
      # the other direction: 503 is *also* what HealthController returns when the database check
      # fails. dotnet.yml's own conformance-base job proved this the hard way on its first real run:
      # the gate accepted a 503 whose body had checks.memgraph.ok=false from the very first
      # response, Cortadel came up regardless, and every DB-touching test then failed with the
      # driver-level error already recorded in checks.memgraph.error. So this parses the response
      # body (field names are spec/openapi.json's HealthResponse → checks → MemgraphCheck.ok /
      # EmbeddingCheck.ok, not guessed) and requires checks.memgraph.ok == true specifically, while
      # still tolerating checks.embeddings.ok being false — this tier deliberately runs with no
      # embedding provider.
      - name: Wait for Cortadel health (requires the database check; tolerates embeddings being down)
        run: |
          db_ok="false"
          for i in $(seq 1 60); do
            status=$(curl -s -o /tmp/health.json -w '%{http_code}' http://localhost:3001/api/health || echo "000")
            db_ok=$(jq -r '.checks.memgraph.ok // false' /tmp/health.json 2>/dev/null || echo false)
            db_ok="${db_ok:-false}"  # jq exits 0 with empty stdout on a truly empty body
            if [ "$db_ok" = "true" ]; then
              echo "cortadel's database check is healthy (http $status); full body:"
              cat /tmp/health.json; echo
              break
            fi
            echo "waiting for cortadel's database check (http $status, checks.memgraph.ok=$db_ok) ($i/60)..."
            sleep 3
          done
          if [ "$db_ok" != "true" ]; then
            echo "::error::cortadel's database check never reported ok=true. Last /api/health body:"
            cat /tmp/health.json 2>/dev/null || echo "(no response ever captured)"
            echo
            docker logs cortadel
            exit 1
          fi

      - name: Run base-tier conformance suite (4 tests)
        env:
          CORTADEL_CONFORMANCE_URL: http://localhost:3001
        run: pnpm exec vitest run conformance

      - name: Container logs
        if: failure()
        run: |
          echo "── memgraph ──"; docker logs memgraph || true
          echo "── cortadel ──"; docker logs cortadel || true

      - name: Tear down containers
        if: always()
        run: |
          docker rm -f cortadel memgraph 2>/dev/null || true
          docker network rm cortadel-ci 2>/dev/null || true

  conformance-full:
    name: conformance (full tier — LLM + embeddings)
    concurrency:
      group: typescript-conformance-full-${{ github.ref }}
      cancel-in-progress: true
    # Manual or weekly only — never on PR/push. Pulls a ~9.6 GB LLM plus an embedding model via
    # Ollama; too slow/expensive to gate every PR (same ruling dotnet.yml's own conformance-full
    # documents). Its own literal concurrency group (typescript-conformance-full-<ref>, above) means
    # a push to main that triggers build/generation-drift/conformance-base can never cancel an
    # in-flight run of this job — only a second conformance-full run on the same ref can
    # (self-supersession, not cross-job).
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.x'
          cache: pnpm
          cache-dependency-path: sdk/typescript/pnpm-lock.yaml
      # --ignore-scripts: see the build job's own comment on why this is safe here.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # The repo's own documented one-command quickstart (README "Quick start" / self-hosting.md),
      # unmodified: Memgraph + Ollama (pulls the LLM and embedding model, gated by `ollama-pull`'s
      # service_completed_successfully condition) + Cortadel. Deliberately not reinvented for CI so
      # it can't drift from what a real self-hoster actually runs — same reasoning as dotnet.yml's
      # own conformance-full job, which starts the identical stack from the repo root.
      - name: Start the full stack
        working-directory: .
        run: docker compose up -d

      - name: Wait for Cortadel health (expects a genuinely healthy stack)
        working-directory: .
        run: |
          status="000"
          for i in $(seq 1 180); do
            status=$(curl -s -o /tmp/health.json -w '%{http_code}' http://localhost:3001/api/health || echo "000")
            if [ "$status" = "200" ]; then
              echo "cortadel is healthy:"; cat /tmp/health.json; echo
              break
            fi
            echo "waiting for cortadel to become healthy (last status: $status) ($i/180)..."
            sleep 10
          done
          if [ "$status" != "200" ]; then
            echo "::error::cortadel never reported a healthy status (last: $status)"
            docker compose logs
            exit 1
          fi

      - name: Run full conformance suite (9 tests — base + LLM tier)
        env:
          CORTADEL_CONFORMANCE_URL: http://localhost:3001
          CORTADEL_CONFORMANCE_LLM: "1"
        run: pnpm exec vitest run conformance

      - name: Container logs
        if: failure()
        working-directory: .
        run: docker compose logs

      - name: Tear down the stack
        if: always()
        working-directory: .
        run: docker compose down -v

  publish-npm:
    name: publish @cortadel/sdk to npm (provenance)
    needs: [build, generation-drift, conformance-base]
    # Ref-prefix check, not event-name: `github.ref` is `refs/tags/<name>` only when the ref
    # actually being built is that tag — true whether this run was started by the tag `push` itself,
    # or by a `workflow_dispatch` where the operator explicitly picked that tag from the
    # branch/tag selector (the dispatch's default target is the default branch, refs/heads/main,
    # which never matches this prefix). A pull_request ref (refs/pull/<n>/merge) never matches
    # either, so this cannot fire from routine PR/push CI traffic — only a deliberate tag push (or a
    # dispatch explicitly targeting that tag) satisfies it. Same convention as dotnet.yml's
    # publish-nuget.
    if: startsWith(github.ref, 'refs/tags/sdk-ts-v')
    concurrency:
      # Literal per-job name, same convention as every other job in this file — github.job is null
      # outside `steps` (see the file header comment), so it can't be used here. cancel-in-progress
      # is deliberately false: a duplicate/retried run should queue behind an in-flight publish, not
      # cancel it mid-push — the npm registry is append-only and a cancelled-but-partially-applied
      # push is exactly the kind of ambiguity this job must avoid. Matches dotnet.yml's
      # publish-nuget's own reasoning.
      group: typescript-publish-npm-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write   # required for npm provenance (Sigstore/OIDC attestation)
      contents: read
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      # registry-url makes setup-node write an .npmrc that reads the auth token from
      # $NODE_AUTH_TOKEN — the publish step below sets that from the NPM_TOKEN repo secret. This is
      # the standard actions/setup-node mechanism and works for `pnpm publish` the same way it does
      # for `npm publish`, since pnpm honors the same .npmrc.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
          cache-dependency-path: sdk/typescript/pnpm-lock.yaml
      # --ignore-scripts: see the build job's own comment on why this is safe here.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build

      # @cortadel/sdk is scoped, and npm defaults scoped packages to restricted — --access public is
      # mandatory here, not optional (package.json's own publishConfig.access already says the same
      # thing; passing it explicitly too costs nothing and keeps the release step self-documenting).
      # --provenance attaches a signed Sigstore attestation proving this exact build came from this
      # exact commit/workflow run (needs the id-token: write permission above). --no-git-checks:
      # this job checks out a tag ref (detached HEAD), not a branch, which pnpm's default git checks
      # (clean tree, tracked branch) would otherwise reject — the checkout itself, and the
      # build/generation-drift/conformance-base gates in `needs:`, are what vouch for this commit
      # instead.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --access public --provenance --no-git-checks
