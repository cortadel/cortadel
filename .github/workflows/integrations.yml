name: Integrations

# Gates the twelve framework integration packages under integrations/ — eight TypeScript packages
# (pnpm + tsc + vitest), three Python packages (uv + pytest) and one .NET package
# (dotnet build/test/pack). Structure, comment style, permissions and job naming mirror
# .github/workflows/python.yml, .github/workflows/typescript.yml and .github/workflows/dotnet.yml;
# the provisioning below is reused from those three files verbatim rather than re-derived
# (setup-uv's two-step --no-build install split, pnpm/action-setup before actions/setup-node so the
# pnpm store cache resolves, dotnet.yml's 10.0.x-SDK + DOTNET_ROLL_FORWARD pairing, the per-job
# literal concurrency groups).
#
# The split is the packages' own, not a CI preference: where a framework ships a first-party
# TypeScript package as well as a Python one, the integration is TypeScript, and the Microsoft Agent
# Framework integration is .NET. That is why langgraph, deepagents, claude-agent-sdk and
# openai-agents moved from the Python matrix to the TypeScript one and microsoft-agent-framework
# moved to its own .NET job. crewai, pydantic-ai and google-adk stay Python because none of those
# three has a first-party TypeScript package (@iqai/adk is third-party, not Google). Nothing here
# infers a toolchain from that history — the matrix-coverage job below re-derives every package's
# toolchain from the manifest actually on disk and fails if a leg disagrees with it, so a future
# language move that forgets this file is caught rather than silently testing the wrong thing.
#
# What this file deliberately does NOT do, and why:
#
#   * No conformance tier. Every one of the twelve suites is fully offline — each stubs at the
#     Cortadel client boundary and drives the *real* framework in-process (a real compiled
#     LangGraph StateGraph, a real Runner.run(), a real @mastra/core Agent, a real
#     AIContextProvider lifecycle, OpenClaw's own shipped manifest validators, and so on). None of
#     them touch the network, an LLM key, or a Cortadel server, so there is nothing here for the
#     Memgraph + Cortadel container stack that python.yml/typescript.yml/dotnet.yml's
#     conformance-base and conformance-full jobs provision. If a live-server tier is ever added to
#     these packages (several of their reports call it out as a gap), it belongs in new jobs
#     modelled on those, not bolted onto the matrix legs below.
#
#   * No lint step. Checked, not assumed: no ruff/mypy/flake8 configuration exists in any of the
#     three Python pyprojects, no eslint configuration in any of the eight TypeScript packages, and
#     no .editorconfig/analyzer ruleset or `dotnet format` gate in the .NET package. Same ruling
#     python.yml's header records for sdk/python — nothing to run until one is added.
#
# RELEASING. The publish jobs an earlier revision of this header promised ("those get added with the
# first release, together with their own per-package tag prefix") are at the bottom of this file:
# release-plan, publish-npm and publish-pypi. The maintainer-side setup they depend on — none of
# which can be done from a workflow file — is in .github/RELEASING.md. All of it is DONE: every
# package published 0.1.0 on 2026-08-14, so both secrets (NPM_TOKEN_INTEGRATIONS, and the
# account-scoped PYPI_TOKEN that python.yml already used) exist and are proven working.
#
# One follow-up is outstanding and has a DEADLINE. NPM_TOKEN_INTEGRATIONS is a bypass-2FA granular
# token, and npm is withdrawing direct publishing from that token class in January 2027 (the notice
# appears in this job's own publish output). It was only ever needed to bootstrap: npm cannot attach
# a trusted publisher to a package that does not exist. All eight now exist, so RELEASING.md §1.4
# attaches per-package trusted publishers and deletes the secret — after which this job publishes
# with no stored credential at all. Until that is done, the token is an All-Packages read-write
# credential reachable by anyone who can push an integration-*-v* tag.
#
# ⚠ THE .NET PACKAGE DOES NOT PUBLISH FROM THIS FILE. `Cortadel.AgentFramework`
# (integrations/microsoft-agent-framework) is still TESTED here — the `dotnet` matrix leg below is
# its CI gate and matrix-coverage still asserts it has one — but its NuGet publish lives in
# .github/workflows/dotnet.yml, in the `integration-release-plan` + `publish-nuget-integration` jobs.
# The reason is structural, not a preference:
#
#   A nuget.org trusted-publishing policy is a tuple of (package owner, repository owner,
#   repository, WORKFLOW FILE, environment) and never names a package. The `cortadel` account's
#   policy names `dotnet.yml`. Tag `integration-microsoft-agent-framework-v0.1.0` therefore reached
#   this file's NuGet/login step and died there:
#
#       Token exchange failed (HTTP 401) at https://www.nuget.org/api/v2/token.
#       Make sure you are using the username of the policy creator, not the policy owner:
#       Workflow mismatch for policy 'cortadel': expected 'dotnet.yml', actual 'integrations.yml'
#
#   Nothing was published, the tag was deleted and 0.1.0 is unspent. Publishing from the workflow the
#   policy already trusts is what unblocks it without website access.
#
# The cleaner alternative, so this is understood as a constraint: nuget.org allows several policies
# per account, so adding a SECOND policy whose *Workflow file* is `integrations.yml` lets the publish
# move back here as the `publish-nuget` job this file used to have (git history at commit d50675e).
# That needs the nuget.org website. .github/RELEASING.md §3 carries both halves as a checklist.
#
# What is left here in its place is `nuget-release-moved` at the bottom of this file — a signpost
# that publishes nothing, holds no credential, and fails a .NET release tag that dotnet.yml's own
# `tags:` patterns do not cover. Without it, adding a second .NET integration would produce a green
# release run that published nothing at all.
#
# Tag grammar: `integration-<directory-slug>-v<version>`, e.g. integration-langgraph-v0.1.0. The slug
# is the directory under integrations/, never the registry package name — integrations/vercel-ai-sdk
# publishes as @cortadel/vercel-ai-provider, so anything deriving a path from a package name breaks
# on exactly that one. The trigger below is a single permissive glob; all routing happens in
# release-plan, which re-derives the package, its toolchain and its version from the manifest on
# disk. See .github/RELEASING.md and CONTRIBUTING.md#releasing for the full scheme and its rationale.
#
# SECURITY NOTE, because it is not obvious from reading any single job: this file holds release
# credentials for two registries, npm and PyPI. It no longer holds any NuGet credential — there is no
# OIDC exchange in this file at all now that the .NET publish moved to dotnet.yml, which is where the
# nuget.org blast-radius warning moved with it (an owner-scoped nuget.org key can push *every*
# package the `cortadel` account owns, Cortadel.Sdk included; per-package scoping does not exist,
# NuGetGallery issue #10587). Treat dotnet.yml as release-security-sensitive for NuGet, and this file
# for npm and PyPI. Should the publish ever move back here (see the RELEASING note above), that
# warning moves back too — and keep the publish jobs inline when it does: NuGet/login issue #6
# reports a 401 "No matching trust policy" when the publishing job lives in a called/reusable
# workflow, which is why this file contains no `uses: ./`, no `workflow_call` and no
# `secrets: inherit`.
#
# The npm bootstrap token has the same blast radius, for an equally structural reason, and it is
# stated here rather than left implicit in the phrase "bounded by the short expiry":
# NPM_TOKEN_INTEGRATIONS has to be minted *All Packages / Read and write* — npm's package picker
# enumerates only packages that already exist and none of the eight does yet, and a @cortadel-scoped
# token cannot reach the unscoped n8n-nodes-cortadel at all — so while it exists it can also publish
# @cortadel/sdk, which typescript.yml releases under a different and narrower secret. Anyone with
# write access to this repository can reach it by pushing any `integration-*-v*` tag, or by
# dispatching this workflow against one. That is why the phase-4 removal in .github/RELEASING.md
# §1.5 is a deadline and not housekeeping: this token's scope is bounded only by how long it exists.
#
# PYPI_TOKEN's blast radius is stated here too, because it follows from the very property that makes
# it the right credential: an account-scoped PyPI token can upload to *any* project the account owns,
# `cortadel` (the SDK python.yml releases under this same secret) included. That is inherent — a
# project-scoped token cannot create the three projects that do not exist yet — and it is the
# strongest argument for the trusted-publishing follow-up noted below, not a reason to narrow the
# token today.
#
# The three publish jobs use two different auth styles, which reads like an oversight unless stated:
# npm and PyPI authenticate with a stored API token, and NuGet alone uses OIDC trusted publishing.
#
# PyPI is a settled decision, not a stopgap. This repository publishes to PyPI with the
# account-scoped PYPI_TOKEN repository secret — the same secret and the same mechanism python.yml
# already uses to release the `cortadel` SDK. Account-scoped is the load-bearing word: all three
# Python packages here are brand new, and only an account-scoped token can create a project that does
# not exist yet (a project-scoped token provably cannot — Warehouse's ProjectName/ProjectID caveat
# verifiers reject any context outside the projects they enumerate). No trusted publisher is
# configured on pypi.org and none is wanted, so PyPI needs no registry-side setup at all before the
# first tag. Possible follow-up, deliberately NOT implemented here: once the three projects exist,
# migrating them to PyPI trusted publishing would remove the stored token and turn on PEP 740
# attestations.
#
# npm's token, by contrast, IS a stopgap: npm trusted publishing cannot bootstrap a package that does
# not exist ("Package must exist" is a documented prerequisite; npm/cli#8544 is open), so the *first*
# publish of all eight npm packages must be token-authenticated and OIDC can only take over from the
# second release onward. publish-npm carries the exact two-line edit that completes that migration.
#
# Every leg's exact command chain below was executed locally against the committed lockfiles, on
# the same interpreter/runtime the matrix pins. That is what the per-leg version choices are based
# on. Every leg runs at the floor its own manifest declares; crewai was the single historical
# exception and stopped being one when that package narrowed requires-python to >=3.11 (see that
# leg's comment). The floor-drift check in the matrix-coverage job below enforces that agreement,
# so a manifest whose floor moves without this file following it fails the PR instead of silently
# testing the wrong runtime.

on:
  push:
    branches: [main]
    # One permissive glob for all twelve packages, deliberately — NOT twelve per-package patterns.
    #
    # `*` in a GitHub ref filter matches `-`, so twelve overlapping globs would be genuinely unsafe
    # the moment one slug became a prefix of another followed by `-v` (a future `mastra-v2/` package
    # would make `integration-mastra-v*` match `integration-mastra-v2-v1.0.0` and release the wrong
    # thing). None of today's twelve slugs shadows another — checked pairwise; the closest pair,
    # openai-agents/openclaw, diverges at the fifth character — but that is a property of today's
    # names, not an invariant. So this pattern only answers "is this a release tag at all", and every
    # routing decision is made by the release-plan job below, which enumerates every possible `-v`
    # split of the tag, keeps only splits whose left half is a real integrations/ directory WITH a
    # matrix leg, and requires exactly one survivor. Prefix shadowing therefore fails loudly instead
    # of publishing the wrong package, and a thirteenth package needs no edit here.
    #
    # No collision with the SDK tag prefixes: sdk-dotnet-v* (dotnet.yml), sdk-ts-v* (typescript.yml)
    # and sdk-py-v* (python.yml) cannot match this namespace, nor this one theirs.
    #
    # There IS one deliberate overlap, and it is not a collision: dotnet.yml also triggers on
    # `integration-microsoft-agent-framework-v*`, because the nuget.org policy is bound to that
    # filename (see this file's header). A .NET integration tag therefore starts BOTH workflows —
    # this one to run the twelve packages' matrices, matrix-coverage and release-plan, and dotnet.yml
    # to build, test and publish the one package. The two do not race: nothing in this file talks to
    # nuget.org any more.
    #
    # GitHub does NOT evaluate `paths` for tag pushes — path filters only gate branch pushes, as the
    # headers of dotnet.yml/typescript.yml/python.yml each record. So the pattern below is the *only*
    # gate on the tag half of this trigger: pushing a matching tag always runs this workflow (all
    # three matrices, matrix-coverage and release-plan) regardless of which paths the tagged commit
    # touched. That is intentional — a release tag is a deliberate act, unlike an ordinary commit.
    tags: ['integration-*-v*']
    paths:
      - 'integrations/**'
      - '.github/workflows/integrations.yml'
  pull_request:
    paths:
      - 'integrations/**'
      - '.github/workflows/integrations.yml'
  workflow_dispatch:

# Least privilege, workflow-wide default: the twelve test matrices and matrix-coverage only check out
# the tree and run each package's own suite — they read no repository state, comment on nothing, and
# publish nothing. The four release-path jobs at the bottom of this file each state their own
# `permissions:` block holding exactly what their registry mechanism needs, rather than widening this
# default for everyone. Exactly ONE of them needs anything beyond the default: publish-npm
# (`id-token: write`, for the Sigstore provenance attestation). publish-pypi authenticates with an
# API token and performs no OIDC exchange at all; release-plan and nuget-release-moved only read the
# checked-out tree; so all three keep a plain `contents: read`. Since the .NET publish moved to
# dotnet.yml, no job in this file performs a NuGet OIDC exchange.
#
# `secrets.*` appears exactly twice in this file, both times on a publish job: publish-npm's
# NODE_AUTH_TOKEN (NPM_TOKEN_INTEGRATIONS — npm's "package must exist" rule makes it unavoidable for
# a first publish, and it is scheduled for removal; see that job) and publish-pypi's PYPI_TOKEN, the
# account-scoped token this repository already publishes the `cortadel` SDK with in python.yml.
# publish-nuget is the only one that stores nothing. (A grep for `secrets\.` finds a third hit,
# `secrets.token_hex(16)` in release-plan's inline Python — that is the stdlib module, not a GitHub
# secret, and it never leaves the runner.) The trigger is plain `pull_request`, never
# `pull_request_target` (banned repo-wide and enforced by .github/scripts/check-diff-supply-chain.sh),
# so a fork PR still gets no secrets and a read-only token; and no publish job below can fire from a
# `pull_request` event at all, because they all depend on release-plan, which only runs on a tag ref.
permissions:
  contents: read

# No workflow-level concurrency block, matching python.yml/typescript.yml/dotnet.yml: a single group
# covering the whole file would let a new push cancel the entire in-flight run, so one broken leg's
# supersession would take the other eleven down with it. Each job gets its own group instead,
# keyed by a literal per-job name plus the matrix leg's slug — the group literal can NOT be keyed
# by github.job (that context is only populated within a job's `steps` and is null everywhere else,
# including a job-level `concurrency:` block; this repo's dotnet.yml header documents hitting that
# the hard way). Without matrix.slug in the literal, all legs of a matrixed job would share one
# group and cancel each other instead of running in parallel.

jobs:
  typescript:
    name: ${{ matrix.slug }} (node ${{ matrix.node-version }})
    strategy:
      # One broken integration must not hide the other eleven — every leg runs to completion.
      fail-fast: false
      matrix:
        include:
          # node-version is each package's own `engines.node` floor, for the same reason the
          # Python matrix pins requires-python floors and typescript.yml pins '20.x' — CI runs the
          # oldest supported runtime, not the newest. Three of the eight (mastra, openclaw,
          # vercel-ai-sdk) declare a >= 22 floor; `22.x` resolves to the newest 22 release, which
          # satisfies mastra's >=22.13.0 and openclaw's >=22.22.3 without hard-coding a patch
          # version that would silently stop resolving. The other five declare `>=20`. None of
          # these packages ships an .npmrc, so pnpm's engine check is a warning rather than a
          # failure either way.
          #
          # There is no per-leg `typecheck` column: all eight declare the identical script,
          # `tsc --noEmit && tsc -p tsconfig.test.json` — one pass over src via tsconfig.json and a
          # second over src + test via tsconfig.test.json. The single `pnpm run typecheck` step
          # below therefore invokes BOTH passes on every leg. It is also self-guarding: pnpm exits
          # non-zero on a missing script, so a ninth package that ships without one fails its leg
          # loudly instead of silently skipping type checking. This job still adds no script to any
          # package — integrations/<slug>/ is owned elsewhere.
          #
          # The four legs that moved here from the Python matrix (claude-agent-sdk, deepagents,
          # langgraph, openai-agents) were each run through this job's exact command chain locally
          # against their committed pnpm-lock.yaml before being added: install, typecheck, test,
          # build — 99, 97, 132 and 100 tests respectively, all green.
          - slug: claude-agent-sdk
            node-version: '20.x'
          - slug: deepagents
            node-version: '20.x'
          - slug: langgraph
            node-version: '20.x'
          - slug: mastra
            node-version: '22.x'
          - slug: n8n-nodes-cortadel
            node-version: '20.x'
          - slug: openai-agents
            node-version: '20.x'
          - slug: openclaw
            node-version: '22.x'
          - slug: vercel-ai-sdk
            node-version: '22.x'
    concurrency:
      group: integrations-typescript-${{ matrix.slug }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: integrations/${{ matrix.slug }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm/action-setup before actions/setup-node: setup-node's `cache: pnpm` shells out to
      # `pnpm store path`, so pnpm has to exist first. Same order typescript.yml uses.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          # Repo-root-relative, like typescript.yml's own — not resolved against the job's
          # working-directory.
          cache-dependency-path: integrations/${{ matrix.slug }}/pnpm-lock.yaml

      # Each of the eight is a standalone package with its own lockfile (there is no root
      # package.json and no pnpm-workspace.yaml anywhere above integrations/), so a plain
      # `pnpm install` in the package directory is the whole install — no workspace flags needed.
      #
      # No extra flag is needed for peer dependencies either, and that was checked rather than
      # assumed: all eight declare peerDependencies (langgraph's four — @langchain/core,
      # @langchain/langgraph, @langchain/langgraph-checkpoint, zod — are the widest set), and every
      # one of those peers is also present in the same package's devDependencies, so pnpm satisfies
      # them from the lockfile with no `--no-strict-peer-dependencies`, no `auto-install-peers`
      # override and no `--force`. Verified on a wiped node_modules for each of the four new legs:
      # `pnpm install --frozen-lockfile --ignore-scripts` completed with the lockfile untouched
      # ("Lockfile is up to date, resolution step is skipped") and zero peer warnings.
      #
      # --ignore-scripts is about lifecycle scripts, not peers: it blocks dependency install hooks
      # from running arbitrary code. Verified this changes nothing here: none of the eight declares
      # an install-time lifecycle script of its own (checked every package.json for preinstall/
      # install/postinstall/prepare/prepublish — all eight declare exactly build, typecheck, test),
      # and pnpm 10 already refuses to run dependency build scripts unless they are allow-listed in
      # `onlyBuiltDependencies` — which no package.json here declares. The one borderline
      # transitive package, esbuild, appears in all eight lockfiles only as vite's *optional peer*
      # (`esbuild: ^0.27.0 || ^0.28.0`) and never resolves as an installed package; confirmed on
      # disk after a clean install of each of the four new legs (no esbuild@* directory in
      # node_modules/.pnpm). It does not affect explicitly-invoked scripts, so
      # n8n-nodes-cortadel's `build` (tsc + node scripts/copy-assets.mjs) still runs normally.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # Typecheck before tests, matching typescript.yml's build job order: vitest transpiles
      # without type-checking, so tsc is the only thing here that would catch a type error — in
      # either pass, src/ or test/.
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

  python:
    name: ${{ matrix.slug }} (py ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # python-version is each package's own declared requires-python floor, not whatever is
          # newest: CI runs the oldest interpreter the package promises to support, so a
          # 3.12-only construct fails here instead of at a consumer's install. Same ruling
          # python.yml's matrix comment records for sdk/python. Each value below was verified
          # against that package's pyproject.toml on disk in this pass, and is re-verified on every
          # run by the floor-drift check in matrix-coverage.
          - slug: crewai
            # 3.11 is this package's own declared floor — `requires-python = ">=3.11,<3.14"`, not
            # an exception to the floor rule. A 3.10 install cannot succeed: crewai pulls chromadb,
            # whose <3.11 resolution fork reached onnxruntime 1.24.3, and that release publishes no
            # cp310 wheel and no sdist, so there was nothing to fetch and nothing to build from.
            # Re-locking dropped the fork entirely (uv.lock's own requires-python is ">=3.11,
            # <3.14" and onnxruntime resolves to a single 1.28.0). Manifest and leg agree; the
            # floor-drift check below keeps them that way.
            python-version: '3.11'
          - slug: google-adk
            # requires-python = ">=3.10".
            python-version: '3.10'
          - slug: pydantic-ai
            # requires-python = ">=3.10".
            python-version: '3.10'
    concurrency:
      group: integrations-python-${{ matrix.slug }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # Generous enough for the heaviest leg (crewai resolves 159 packages, including a large
    # onnxruntime wheel) without letting a hung leg burn a full hour of runner time.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: integrations/${{ matrix.slug }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          # Repo-root-relative, like python.yml's own — this path is NOT resolved against the
          # job's working-directory.
          cache-dependency-glob: integrations/${{ matrix.slug }}/uv.lock

      # The same two-step split python.yml's build job uses, for the same reasons.
      # --no-install-project defers installing the local package to the step below; --no-build
      # forces pre-built wheels for every *third-party* dependency, so a compromised transitive
      # dependency can't run arbitrary code from a setup.py/build-backend hook during install;
      # --locked asserts uv.lock is already consistent with pyproject.toml instead of silently
      # re-resolving. Verified across all three remaining locks: every locked third-party
      # distribution publishes a wheel, so --no-build costs nothing today. If a future lock update
      # introduces an sdist-only dependency this step fails loudly — that is the flag working as
      # intended, and the fix is to look at the new dependency, not to drop it.
      #
      # --group build adds the PEP 735 dependency group each of the three pyprojects declares,
      # holding the hatchling build backend and editables. It is what makes the --no-build-isolation
      # install below possible: that flag runs whatever backend is already in the environment, so
      # the backend has to arrive here, from the lock, instead of being resolved live at build time.
      # A dependency group rather than a second extra deliberately — groups are local development
      # metadata and never reach a built wheel, so nothing about the published packages or their
      # `test` extra changes. --no-install-project does not suppress the group: verified per leg
      # that hatchling and editables land in the venv while the project itself stays uninstalled.
      - run: uv sync --extra test --group build --no-install-project --no-build --locked
      # The local package, installed on its own with --no-deps: every dependency is already in
      # place from the step above, so this resolves nothing external.
      #
      # The two-step split really is necessary, and the two halves behave differently under
      # --no-build — worth recording, because the flag reads like it should break both:
      #   * `uv sync --no-build` (i.e. dropping --no-install-project above) FAILS with
      #     "`cortadel-crewai==0.1.0 @ editable+.` can't be installed because it is marked as
      #     `--no-build` but has no binary distribution". So the local package cannot be folded
      #     back into the sync step.
      #   * `uv pip install --no-deps --no-build ... -e .` SUCCEEDS on all three legs.
      # So the stricter flag is carried here too, rather than leaving this as the one install in
      # the job where a build hook could still run.
      #
      # --no-build-isolation is what closes SonarCloud githubactions:S8544 ("Python dependencies
      # should be locked to verified versions") on this line. An earlier revision of this comment
      # argued the finding was a false positive because "no index is queried and no remote artifact
      # is fetched". That claim was measured and it is FALSE — do not restore it. --no-deps only
      # disables resolution of the package's *runtime* dependencies; building the editable wheel is
      # a separate PEP 517 step, and under build isolation uv spins up a throwaway environment and
      # resolves `[build-system] requires` from PyPI on every run:
      #
      #     DEBUG Adding direct dependency: hatchling*
      #     DEBUG Sending revalidation request for: https://pypi.org/simple/hatchling/
      #     DEBUG Selecting: hatchling==1.32.0 [compatible]
      #     DEBUG Calling `hatchling.build.get_requires_for_build_editable()`
      #     DEBUG Adding direct dependency: editables>=0.3, <1.dev0
      #
      # Eight packages in all (hatchling, editables, packaging, pathspec, pluggy, tomli, tomlkit,
      # trove-classifiers), unpinned, unhashed and whatever is newest that day. That is exactly the
      # class of unlocked dependency the rule exists to catch, and the one install in this job
      # --no-build could never have covered: --no-build governs third-party *sdists*, not our own
      # build backend.
      #
      # With --no-build-isolation uv runs the backend already present in the synced venv, which
      # `--group build` above installs from uv.lock. Verified on each of the three legs by
      # re-running this exact command with `-v --refresh`: zero pypi.org/simple requests (down from
      # eight packages' worth), and hatchling now loading from
      # .venv/lib/site-packages/hatchling/build.py rather than a temporary build environment.
      # editables has to be in that group even though `[build-system] requires` never mentions it —
      # hatchling requests it through the dynamic get_requires_for_build_editable() hook above, and
      # without it this step fails with "ModuleNotFoundError: No module named 'editables'".
      #
      # There is deliberately NO `uv pip install -e .` step here. The local package reaches the
      # tests through PYTHONPATH instead (below), which is equivalent: an editable install's entire
      # effect on sys.path is a .pth file holding this one directory, so either way the import
      # resolves to the tree under review rather than to a copy in site-packages. Installing the
      # built wheel by path would NOT be equivalent: pytest puts only tests/ on sys.path here, so
      # the import would come from site-packages and the tests would stop exercising the tree.
      #
      # Two details that both have to be right, and were each found by running the legs rather than
      # by reasoning about them:
      #   * It must be the PYTHONPATH *environment variable*, not pytest's `-o pythonpath=.` ini
      #     option. That option only populates the pytest process's own sys.path, and
      #     crewai's tests/test_public_api.py spawns a subprocess
      #     (`subprocess.run([sys.executable, "-c", ...])`) which does not inherit it —
      #     ModuleNotFoundError: No module named 'cortadel_crewai'.
      #   * It must be ABSOLUTE. A relative `.` is resolved against each process's own cwd at
      #     interpreter start, and that same subprocess runs with `cwd=tmp_path`, so a relative
      #     entry points at the temp directory and the import fails there too.
      #
      # Dropping the step is what finally clears SonarCloud githubactions:S8544. The substance was
      # already fixed by --no-build-isolation above, but the rule matches the shape of a
      # `uv pip install <target>` line rather than measuring what it resolves, so the finding
      # survived the fix. Removing the command removes the surface, and costs nothing.
      #
      # `--group build` above is still required: `uv build` at the end of this job runs the same
      # PEP 517 backend and needs hatchling + editables present rather than resolved from the index.

      # tests/ explicitly, even though all three already set `testpaths = ["tests"]` — the path is
      # passed so this step documents its own scope rather than relying on config a reader of this
      # file might not have open. Two of the three (crewai, pydantic-ai) also set
      # `filterwarnings = ["error"]`, so a new DeprecationWarning out of the framework fails the
      # leg; that is deliberate on the packages' part and is left alone here.
      # --no-sync: the venv is already fully synced by the step above, so uv never re-resolves or
      # re-installs; this step only ever runs pytest.
      # PYTHONPATH replaces the editable install — see the block above for why it is an env var and
      # why it is absolute. Set on the step rather than the job so it applies to exactly the process
      # that needs it.
      - run: uv run --no-sync --no-build --locked pytest tests -q
        env:
          PYTHONPATH: ${{ github.workspace }}/integrations/${{ matrix.slug }}

      # `uv build`, not python.yml's `uv run --with build python -m build`: that file uses the
      # literal `build` tool because its own task specified it, and pays for an ephemeral overlay
      # plus an isolated build environment to get it. Nothing here specifies a frontend, and
      # multiplying two extra PyPI round-trips across the legs to reach the identical artifact is
      # not worth it. uv's own build frontend produces the same sdist+wheel from the same
      # hatchling backend. This builds our own trusted source, which is the point of the step —
      # it is not the third-party sdist execution --no-build blocks above.
      #
      # --no-build-isolation for the same reason as the install step, and it is not redundant with
      # it: `uv build` provisions its own build environments and was resolving hatchling from the
      # index twice more per leg (once for the sdist, once for the wheel). The flag changes only
      # where the backend comes from, not what is produced — checked by diffing the verbose logs
      # with and without it, both of which call `build_sdist` then `build_wheel` against the source
      # tree — and both artifacts still satisfy the py.typed check below.
      - name: Build sdist and wheel
        run: uv build --sdist --wheel --no-build-isolation .

      # PEP 561: py.typed is what makes a type checker treat the installed package as typed rather
      # than falling back to Any. All three declare it in their hatch include lists, but a target
      # misconfiguration would silently drop it while everything else still builds cleanly — so
      # this is checked inside the built archives, not inferred from pyproject.toml. Matched by
      # suffix rather than by an exact module path so this one step serves every leg
      # (cortadel_crewai/, cortadel_google_adk/, cortadel_pydantic_ai/).
      #
      # A heredoc, not `python -c "..."`: a multi-line -c string indented for this file's own
      # readability hands Python a script whose first statement is indented with no preceding
      # block (IndentationError on line 1). YAML's `|` block scalar strips the block's common
      # leading indentation, so every heredoc line lands flush at column 0 for Python regardless
      # of how deeply this step is nested — same fix python.yml's equivalent step carries.
      - name: Confirm py.typed ships in both the sdist and the wheel
        run: |
          uv run --no-sync --no-build --locked python - <<'PY'
          import glob
          import sys
          import tarfile
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          sdist = glob.glob("dist/*.tar.gz")[0]

          with zipfile.ZipFile(wheel) as z:
              wheel_names = z.namelist()
          if not any(n.endswith("/py.typed") for n in wheel_names):
              sys.exit(f"py.typed missing from wheel {wheel}: {wheel_names}")

          with tarfile.open(sdist) as t:
              sdist_names = t.getnames()
          if not any(n.endswith("/py.typed") for n in sdist_names):
              sys.exit(f"py.typed missing from sdist {sdist}: {sdist_names}")

          print(f"py.typed present in {wheel} and {sdist}")
          PY

  dotnet:
    name: ${{ matrix.slug }} (.NET SDK ${{ matrix.dotnet-version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # One leg today, but still a matrix — so matrix-coverage below can read all three
          # toolchains out of this file the same way, and so a second .NET integration is one
          # entry rather than a second job.
          #
          # `solution` is a column, not a hard-coded path, for the same reason. This package
          # carries its own Cortadel.AgentFramework.slnx *inside its folder* and is deliberately
          # absent from the repo-root Cortadel.slnx: the root solution is dotnet.yml's build
          # surface (sdk/dotnet/* plus examples/dotnet-quickstart), and adding an integration to it
          # would drag this package into that workflow's gate and double-build it here. The
          # floor-drift check below asserts that separation on every run — if the package is ever
          # added to Cortadel.slnx, this workflow fails and says why.
          - slug: microsoft-agent-framework
            # 10.0.x, not the package's own net8.0 target framework — the same pin, for the same
            # reason, that dotnet.yml's header documents at length: the .slnx solution format needs
            # a >=9.0.200-class SDK/MSBuild to parse at all (an isolated .NET 8.0.423 SDK fails
            # `dotnet restore` on a .slnx outright with "MSB4068: The element <Solution> is
            # unrecognized"). The projects still target net8.0; only the CLI/MSBuild doing the
            # building needs to be newer, so exactly one SDK is installed here rather than an
            # 8.0.x/10.0.x pair. Verified locally against this package's own solution on SDK
            # 10.0.400: restore, build -c Release, test (81/81) and pack all succeed.
            dotnet-version: '10.0.x'
            solution: Cortadel.AgentFramework.slnx
            # The single packable project. The solution also holds the test project
            # (IsPackable=false) and examples/BasicMemoryAgent (an Exe, IsPackable=false), so
            # `dotnet pack` is aimed at the library rather than the solution.
            package-project: Cortadel.AgentFramework/Cortadel.AgentFramework.csproj
    concurrency:
      group: integrations-dotnet-${{ matrix.slug }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The second-order consequence of pinning the SDK newer than the target framework, lifted from
    # dotnet.yml's header along with its reproduction: a runner with only the 10.0.x SDK installed
    # has no net8.0 *shared runtime* either, and `dotnet test` executes the compiled test binary
    # (not just restores/compiles it), so it needs that runtime — not just the reference assemblies
    # restore uses. Without this, the test step fails with "You must install or update .NET...
    # Framework: Microsoft.NETCore.App, version 8.0.0. The following frameworks were found:
    # 10.0.x." DOTNET_ROLL_FORWARD=LatestMajor runs the net8.0 test binary on the net10 runtime and
    # is the technique this repo already uses on every dotnet.yml job that runs `dotnet test`;
    # reused here for consistency rather than installing a second SDK side by side. This could not
    # be reproduced on the local machine (it has the net8.0 runtime installed, which masks it), so
    # it rests on dotnet.yml's documented isolated reproduction rather than a fresh one — the
    # floor-drift check below asserts the pairing stays in place, since dropping it is silent until
    # CI runs.
    env:
      DOTNET_ROLL_FORWARD: LatestMajor
    defaults:
      run:
        working-directory: integrations/${{ matrix.slug }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same pinned action and same version as dotnet.yml's four jobs.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      # Explicit restore, then build --no-restore, then test --no-build: the same three-step chain
      # dotnet.yml's build job uses, so each stage fails on its own step instead of a bare
      # `dotnet test` implicitly restoring and building using whatever NuGet feed state is live at
      # that moment. Both third-party PackageReferences resolve from nuget.org (checked: Cortadel.
      # Sdk 1.0.0 and Microsoft.Agents.AI 1.17.0 are both published), so this needs no local feed
      # and no NuGet.config.
      - run: dotnet restore ${{ matrix.solution }}
      - run: dotnet build ${{ matrix.solution }} --no-restore -c Release
      # The solution, not the test project directly: `dotnet test` on a .slnx runs only the
      # projects marked IsTestProject and ignores the library and the example Exe. Verified — it
      # reports "A total of 1 test files matched the specified pattern" and runs the 81 tests.
      - run: dotnet test ${{ matrix.solution }} --no-build -c Release --nologo

      # The .NET counterpart of the Python legs' `uv build`: prove the publishable artifact is
      # producible. --no-build reuses the Release output the step above already produced.
      - name: Pack the .nupkg
        run: dotnet pack ${{ matrix.package-project }} --no-build -c Release -o ./nupkg

      # The .NET counterpart of the py.typed check above, and it guards the same class of silent
      # regression. The project sets GenerateDocumentationFile=true; that XML file is what gives a
      # consumer IntelliSense and parameter docs off the published package, and a packaging change
      # can drop it while the .nupkg still builds and restores perfectly. So it is checked inside
      # the built archive rather than inferred from the csproj — as is the lib/ assembly itself and
      # the PackageReadmeFile, both of which nuget.org requires to be genuinely present.
      # A heredoc for the same indentation reason as the Python step above.
      - name: Confirm the assembly, its XML docs and the README ship in the .nupkg
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import zipfile

          packages = sorted(glob.glob("nupkg/*.nupkg"))
          if not packages:
              sys.exit("dotnet pack produced no .nupkg under nupkg/")

          for package in packages:
              with zipfile.ZipFile(package) as z:
                  names = z.namelist()
              missing = []
              if not any(n.startswith("lib/") and n.endswith(".dll") for n in names):
                  missing.append("a lib/<tfm>/*.dll assembly")
              if not any(n.startswith("lib/") and n.endswith(".xml") for n in names):
                  missing.append(
                      "the XML documentation file (GenerateDocumentationFile is set — a consumer "
                      "gets no IntelliSense without it)"
                  )
              if not any(n.lower().endswith("readme.md") for n in names):
                  missing.append("the PackageReadmeFile (README.md)")
              if missing:
                  sys.exit(f"{package} is missing {', '.join(missing)}. Contents: {names}")
              print(f"{package} ships its assembly, XML docs and README")
          PY

  # Three invisible failure modes, all closed by reading this workflow's own matrices back out of
  # the YAML and comparing them against what is actually on disk. Same instinct as the
  # generated-content-drift and docs-mirror jobs in pr.yml: a check that passes for the wrong
  # reason is worse than no check, so each convention this file relies on gets enforced.
  #
  #   1. Coverage. A thirteenth package added under integrations/ would otherwise get no CI at
  #      all — the `paths:` filter above would fire, all three matrices would run, and every leg
  #      would pass without ever having looked at the new package.
  #
  #   2. Toolchain placement. This is the new one, and this pass is exactly why it exists: five of
  #      the twelve packages changed implementation language at once. A leg left behind in the old
  #      matrix is *worse* than a missing leg — the old job would still run, still be green (uv
  #      would fail on a missing pyproject.toml, but a half-migrated package with both manifests
  #      would not), and a plain set-difference coverage check would report full coverage the whole
  #      time. So each package's toolchain is re-derived from the manifest on disk (package.json /
  #      pyproject.toml / *.slnx) and compared against the matrix that claims it. A package listed
  #      under the wrong toolchain, listed twice, carrying two manifests at once, or carrying none
  #      all fail here with a message naming what disk actually says.
  #
  #   3. Floor drift. Every leg pins the package's own declared floor rather than the newest
  #      runtime, so CI exercises the oldest interpreter/Node the package promises. That is a
  #      convention held together by comments, and it has already desynced once: crewai moved its
  #      requires-python floor from >=3.10 to >=3.11 in the package, and nothing but a human
  #      reading this file would have noticed if the matrix had not followed. Now a floor that
  #      moves without this file following it fails the PR. The .NET arm checks the inverse
  #      invariant, because .NET's is inverted by design (see that arm's own comment).
  matrix-coverage:
    name: every integrations/ package has a matrix leg, in the right toolchain, on its declared floor
    concurrency:
      group: integrations-matrix-coverage-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # python3 ships on every GitHub-hosted ubuntu-latest runner; PyYAML does not, so it is
      # installed on demand rather than assumed present — the same best-effort line pr.yml's
      # workflow-integrity job uses for its own YAML parse check.
      - name: Compare the matrix legs against integrations/ on disk
        run: |
          python3 -c "import yaml" 2>/dev/null || pip install --quiet --disable-pip-version-check --only-binary :all: "pyyaml==6.0.3"
          python3 - <<'PY'
          import pathlib
          import sys

          import yaml

          TOOLCHAINS = ("typescript", "python", "dotnet")

          # Only jobs["..."] is read, never wf["on"] — YAML 1.1 parses a bare `on:` key as the
          # boolean True, which is a trap for anything that tries to look the trigger up by name.
          wf = yaml.safe_load(open(".github/workflows/integrations.yml", encoding="utf-8"))

          # slug -> the toolchain matrix that claims it. A slug claimed by two matrices is its own
          # error: both jobs would run, and a naive set-difference coverage check would net out to
          # "covered" while one of the two ran the wrong toolchain against the package.
          claimed = {}
          duplicated = []
          for job in TOOLCHAINS:
              for leg in wf["jobs"][job]["strategy"]["matrix"]["include"]:
                  slug = leg["slug"]
                  if slug in claimed:
                      duplicated.append(f"{slug} (claimed by both the {claimed[slug]} and {job} matrices)")
                  else:
                      claimed[slug] = job

          # The toolchain is derived from the manifest that is actually on disk, never from the
          # matrix — that is the whole point of this check. A .slnx rather than a *.csproj glob:
          # the .NET convention here is a per-package solution file at the package root, and
          # globbing csproj would also match a TypeScript package that happened to vendor one.
          def toolchains_on_disk(directory):
              found = []
              if (directory / "package.json").is_file():
                  found.append("typescript")
              if (directory / "pyproject.toml").is_file():
                  found.append("python")
              if any(directory.glob("*.slnx")):
                  found.append("dotnet")
              return found

          # Directories only: integrations/README.md and any future loose file are not packages.
          on_disk = {}
          undecidable = set()
          unrecognised = []
          ambiguous = []
          for p in sorted(pathlib.Path("integrations").iterdir()):
              if not p.is_dir() or p.name.startswith("."):
                  continue
              found = toolchains_on_disk(p)
              if len(found) == 1:
                  on_disk[p.name] = found[0]
              elif not found:
                  undecidable.add(p.name)
                  unrecognised.append(p.name)
              else:
                  undecidable.add(p.name)
                  ambiguous.append(f"{p.name} (carries both a {' and a '.join(sorted(found))} manifest)")

          missing = sorted(set(on_disk) - set(claimed))
          # `undecidable` is subtracted so a half-migrated package is reported once, by the
          # ambiguous/unrecognised error that actually explains it — not also as "stale: names a
          # directory that does not exist", which would be plainly false of a directory sitting
          # right there.
          stale = sorted(set(claimed) - set(on_disk) - undecidable)
          misplaced = sorted(
              f"{slug} is a {on_disk[slug]} package on disk but is listed in the {claimed[slug]} matrix"
              for slug in set(on_disk) & set(claimed)
              if on_disk[slug] != claimed[slug]
          )

          if missing:
              print(
                  "::error::These integrations/ packages have no matrix leg in "
                  ".github/workflows/integrations.yml, so nothing is testing them: "
                  + ", ".join(missing)
              )
          if stale:
              print(
                  "::error::These matrix legs name an integrations/ directory that does not "
                  "exist (renamed or removed?): " + ", ".join(stale)
              )
          if misplaced:
              print(
                  "::error::These packages are in the wrong matrix — the leg runs, and passes, "
                  "without ever exercising the package's real toolchain: " + "; ".join(misplaced)
              )
          if duplicated:
              print(
                  "::error::These slugs appear in more than one matrix; exactly one toolchain "
                  "must own each package: " + "; ".join(duplicated)
              )
          if ambiguous:
              print(
                  "::error::These integrations/ packages carry more than one toolchain manifest, "
                  "so which job should own them is undecidable — finish the migration by deleting "
                  "the retired manifest: " + "; ".join(ambiguous)
              )
          if unrecognised:
              print(
                  "::error::These integrations/ directories carry no package.json, pyproject.toml "
                  "or *.slnx, so this check cannot tell which toolchain should own them: "
                  + ", ".join(unrecognised)
              )

          if missing or stale or misplaced or duplicated or ambiguous or unrecognised:
              sys.exit(1)

          for toolchain in TOOLCHAINS:
              slugs = sorted(s for s, t in on_disk.items() if t == toolchain)
              print(f"{toolchain} ({len(slugs)}): {', '.join(slugs)}")
          print(f"All {len(on_disk)} integrations/ package(s) are covered by the matching toolchain.")
          PY

      # The second check: each leg's runtime against the floor its package actually declares.
      # tomllib is stdlib from 3.11 and ubuntu-latest runners ship 3.12, so pyproject.toml is
      # parsed rather than regex-scraped; package.json is plain JSON. PyYAML is already installed
      # by the step above, whose `pip install` is a no-op on the second call if it ran.
      - name: Compare each matrix leg's runtime against the package's declared floor
        run: |
          python3 -c "import yaml" 2>/dev/null || pip install --quiet --disable-pip-version-check --only-binary :all: "pyyaml==6.0.3"
          python3 - <<'PY'
          import json
          import pathlib
          import re
          import sys
          import tomllib

          import yaml

          wf = yaml.safe_load(open(".github/workflows/integrations.yml", encoding="utf-8"))
          problems = []

          # Node: majors only. The matrix pins '22.x' (newest 22) rather than a patch, precisely so
          # a floor like '>=22.22.3' keeps resolving as new patches land; comparing patches here
          # would demand a pin that goes stale on its own.
          for leg in wf["jobs"]["typescript"]["strategy"]["matrix"]["include"]:
              slug = leg["slug"]
              pinned = str(leg["node-version"])
              declared = json.loads(
                  pathlib.Path(f"integrations/{slug}/package.json").read_text(encoding="utf-8")
              ).get("engines", {}).get("node")
              pinned_major = re.fullmatch(r"(\d+)\.x", pinned)
              declared_major = re.search(r">=\s*(\d+)", declared or "")
              if not pinned_major:
                  problems.append(f"{slug}: matrix node-version {pinned!r} is not the expected '<major>.x' form")
              elif not declared_major:
                  problems.append(
                      f"{slug}: package.json declares engines.node = {declared!r}; this check "
                      f"needs a '>=' floor to compare the matrix leg against"
                  )
              elif pinned_major.group(1) != declared_major.group(1):
                  problems.append(
                      f"{slug}: matrix runs Node {pinned}, but package.json declares "
                      f"engines.node = {declared!r}. CI runs the oldest major the package "
                      f"promises — move the leg to {declared_major.group(1)}.x."
                  )

          # Python: the single `>=X.Y` clause of requires-python. An upper bound is allowed and
          # ignored (crewai carries '<3.14' from crewai's own cap); what must match the leg is the
          # lower bound, because that is the interpreter a consumer can legally install on.
          for leg in wf["jobs"]["python"]["strategy"]["matrix"]["include"]:
              slug = leg["slug"]
              pinned = str(leg["python-version"])
              spec = tomllib.loads(
                  pathlib.Path(f"integrations/{slug}/pyproject.toml").read_text(encoding="utf-8")
              )["project"]["requires-python"]
              floors = re.findall(r">=\s*(\d+\.\d+)", spec)
              if len(floors) != 1:
                  problems.append(
                      f"{slug}: cannot read a single '>=' lower bound out of "
                      f"requires-python = {spec!r}; this check needs one to compare against"
                  )
              elif floors[0] != pinned:
                  problems.append(
                      f"{slug}: matrix runs Python {pinned}, but pyproject.toml declares "
                      f"requires-python = {spec!r} (floor {floors[0]}). CI runs the oldest "
                      f"interpreter the package promises — move the leg to {floors[0]}, or fix "
                      f"the floor if {floors[0]} is not really installable."
                  )

          # .NET, and the invariant here is deliberately the *inverse* of the two above. The
          # Python/Node legs pin the oldest runtime the package supports; the .NET leg pins an SDK
          # NEWER than the package's target framework on purpose, because the .slnx solution format
          # needs a >=9.0.200-class MSBuild to parse at all while the projects still target net8.0.
          # So instead of "leg == floor" this asserts the three things that pairing depends on, each
          # of which fails silently or confusingly if it drifts:
          #   * the SDK can build the target framework (SDK major >= TFM major), and is new enough
          #     for .slnx at all;
          #   * whenever the SDK is newer than the TFM, DOTNET_ROLL_FORWARD is set on the job —
          #     without it `dotnet test` compiles fine and then fails at launch with a missing
          #     Microsoft.NETCore.App, which reads like a broken test rather than a missing runtime;
          #   * the package stays out of the repo-root Cortadel.slnx, which is dotnet.yml's build
          #     surface. Adding it there would pull an integration into that workflow's gate and
          #     build it twice, and nothing else in either file would notice.
          dotnet_job = wf["jobs"]["dotnet"]
          roll_forward = (dotnet_job.get("env") or {}).get("DOTNET_ROLL_FORWARD")
          root_solution = pathlib.Path("Cortadel.slnx").read_text(encoding="utf-8").replace("\\", "/")

          for leg in dotnet_job["strategy"]["matrix"]["include"]:
              slug = leg["slug"]
              package = pathlib.Path("integrations") / slug

              for column in ("solution", "package-project"):
                  named = package / str(leg[column])
                  if not named.is_file():
                      problems.append(
                          f"{slug}: matrix {column} is {leg[column]!r}, which does not exist at {named}"
                      )

              sdk = re.fullmatch(r"(\d+)\.\d+\.x", str(leg["dotnet-version"]))
              if not sdk:
                  problems.append(
                      f"{slug}: matrix dotnet-version {leg['dotnet-version']!r} is not the "
                      f"expected '<major>.<minor>.x' form"
                  )
                  continue
              sdk_major = int(sdk.group(1))

              # bin/ and obj/ are gitignored, so they never exist on a CI checkout; skipped anyway
              # so this behaves identically when run locally in a tree that has been built.
              targets = set()
              for csproj in sorted(package.rglob("*.csproj")):
                  if {"bin", "obj"} & set(csproj.parts):
                      continue
                  targets |= {
                      int(m)
                      for m in re.findall(
                          r"<TargetFramework>net(\d+)\.\d+</TargetFramework>",
                          csproj.read_text(encoding="utf-8"),
                      )
                  }
              if not targets:
                  problems.append(
                      f"{slug}: no <TargetFramework>netN.M</TargetFramework> found in any .csproj "
                      f"under {package}; this check needs one to compare the SDK against"
                  )
                  continue
              newest_target = max(targets)

              if sdk_major < newest_target:
                  problems.append(
                      f"{slug}: matrix installs the .NET {sdk_major}.x SDK, but the package "
                      f"targets net{newest_target}.0 — that SDK cannot build it. Raise "
                      f"dotnet-version."
                  )
              if sdk_major < 9:
                  problems.append(
                      f"{slug}: matrix installs the .NET {sdk_major}.x SDK, but {leg['solution']} "
                      f"is a .slnx and that format needs a >=9.0.200-class SDK/MSBuild to parse "
                      f"(an 8.x SDK fails restore with 'MSB4068: The element <Solution> is "
                      f"unrecognized')."
                  )
              if sdk_major > newest_target and not roll_forward:
                  problems.append(
                      f"{slug}: matrix installs the .NET {sdk_major}.x SDK for a net{newest_target}.0 "
                      f"package, but the dotnet job sets no DOTNET_ROLL_FORWARD. A runner with only "
                      f"the {sdk_major}.x SDK has no net{newest_target}.0 shared runtime, so "
                      f"`dotnet test` builds and then fails at launch on a missing "
                      f"Microsoft.NETCore.App. Set env.DOTNET_ROLL_FORWARD: LatestMajor on the job."
                  )
              if f"integrations/{slug}/" in root_solution:
                  problems.append(
                      f"{slug}: the repo-root Cortadel.slnx now references this package. It is "
                      f"deliberately excluded — the root solution is dotnet.yml's build surface, "
                      f"and including an integration there pulls it into that workflow's gate and "
                      f"builds it twice. Remove it from Cortadel.slnx; this workflow builds "
                      f"{leg['solution']} from the package's own folder."
                  )

          for problem in problems:
              print(f"::error::{problem}")
          if problems:
              sys.exit(1)

          print("Every matrix leg runs at the floor (or, for .NET, the pairing) its own manifest declares.")
          PY

  # ────────────────────────────────────────────────────────────────────────────────────────────────
  # The release path. Four jobs, reachable only by pushing a tag matching `integration-*-v*`.
  #
  #     release-plan ──┬──▶ publish-npm          (needs: matrix-coverage + the whole typescript matrix)
  #                    ├──▶ publish-pypi         (needs: matrix-coverage + the whole python matrix)
  #                    └──▶ nuget-release-moved  (publishes NOTHING — see below)
  #
  # Two registries are released from this file. The third, NuGet, is released from dotnet.yml because
  # the nuget.org policy is bound to that workflow FILENAME — the file header has the 401 that proved
  # it. `nuget-release-moved` is what remains here: it holds no credential, contacts no registry, and
  # exists so a .NET release tag that dotnet.yml does not cover fails loudly instead of producing a
  # green run in which nobody published anything.
  #
  # WHY A PLANNER JOB. One tag namespace covers all twelve packages, so every integration tag
  # triggers all three downstream jobs and two of the three must skip *cleanly* rather than fail.
  # Parsing the tag inside each publish job would mean three copies of the parser — and therefore
  # three places for the version gate to drift. release-plan parses once, validates once against the
  # manifest actually on disk, and hands typed outputs down. It is also where the tag-vs-manifest
  # version gate lives, which is what guarantees that gate runs for all three toolchains and *before*
  # any registry is contacted. It keeps resolving .NET tags for exactly that reason: the gate must
  # still run on this side, and matrix-coverage's guarantees about the dotnet leg are what dotnet.yml
  # reads its solution / package-project / SDK columns out of.
  #
  # WHY EACH PUBLISH JOB NEEDS ITS WHOLE MATRIX, NOT JUST THE TAGGED LEG. A publish must not run
  # unless that package's own tests passed on that exact commit, and `needs:` is the only mechanism
  # that expresses it. Depending on the matrix job means depending on all of its legs, so releasing
  # @cortadel/langgraph requires all eight TypeScript legs green. That coupling is deliberate and the
  # alternatives are worse:
  #   * narrowing the matrix on a tag run (`matrix: fromJSON(...)`) would replace the static
  #     `include:` lists with an expression — and matrix-coverage above reads those lists statically
  #     out of this file with PyYAML. It is the check that stops a package from silently losing CI
  #     altogether, and blinding it to buy release convenience is the wrong trade.
  #   * a separate single-package verify job would run the tagged package's suite a second time on
  #     every release tag, and would drift from the matrix leg it duplicates.
  # The coupling does not cross toolchains: the two publish jobs depend on two different matrix jobs,
  # so a red crewai leg cannot block an npm release. The .NET package's equivalent coupling now lives
  # in dotnet.yml, which runs this package's own build+test itself before publishing — `needs:`
  # cannot cross workflow files, so that is the only mechanism available there.
  #
  # Note on `if:` + `needs:` — a job-level `if:` does NOT relax the needs-succeeded requirement (only
  # a status function such as always() would). So each publish job's effective gate is "all three
  # dependencies succeeded AND this tag belongs to my toolchain", which is exactly what is wanted.
  # On any non-tag run release-plan is skipped, and a skipped dependency skips its dependents — so no
  # publish job can fire from PR or push traffic even before its `if:` is evaluated.
  #
  # cancel-in-progress is false on all four, matching typescript.yml's publish-npm / python.yml's
  # publish-pypi / dotnet.yml's two publish jobs: all three registries are append-only and none
  # permits reusing a version, so a duplicate or retried run must queue behind an in-flight publish
  # rather than cancel it mid-push. release-plan is included because cancelling it would fail the
  # publishes it gates for a reason that has nothing to do with the release, and nuget-release-moved
  # because a cancelled signpost is indistinguishable from a passing one.
  # ────────────────────────────────────────────────────────────────────────────────────────────────

  release-plan:
    name: resolve the tagged package and check the tag against its manifest
    # Ref-prefix check, not event-name: `github.ref` is `refs/tags/<name>` only when the ref actually
    # being built is that tag — true whether this run was started by the tag `push` itself, or by a
    # `workflow_dispatch` where the operator explicitly picked that tag from the branch/tag selector
    # (the dispatch's default target is the default branch, refs/heads/main, which never matches this
    # prefix). A pull_request ref (refs/pull/<n>/merge) never matches either, so this cannot fire from
    # routine PR/push CI traffic — only a deliberate tag push (or a dispatch explicitly targeting that
    # tag) satisfies it. Same convention as dotnet.yml's publish-nuget / typescript.yml's publish-npm
    # / python.yml's publish-pypi.
    if: startsWith(github.ref, 'refs/tags/integration-')
    concurrency:
      # Literal per-job name plus the ref, same convention as every other job in this file —
      # github.job is null outside `steps` (see the file header comment), so it can't be used here.
      group: integrations-release-plan-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      slug: ${{ steps.plan.outputs.slug }}
      version: ${{ steps.plan.outputs.version }}
      toolchain: ${{ steps.plan.outputs.toolchain }}
      package-name: ${{ steps.plan.outputs.package-name }}
      # package-project and dotnet-version have no consumer in this file since the NuGet publish
      # moved to dotnet.yml (which resolves both independently, out of this file's dotnet matrix).
      # They are kept rather than deleted for two reasons: package-project is what the version gate
      # below reads the csproj through, so it exists either way; and the pair is exactly the contract
      # a restored `publish-nuget` needs on the day a policy naming this file is created. Costs
      # nothing, and deleting them would make the move back a bigger edit than the move out.
      package-project: ${{ steps.plan.outputs.package-project }}
      python-version: ${{ steps.plan.outputs.python-version }}
      dotnet-version: ${{ steps.plan.outputs.dotnet-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The tag name arrives through the environment, never interpolated into the shell — a `${{ }}`
      # substitution inside a `run:` block is textual, so a tag containing shell metacharacters would
      # be executed rather than parsed. Everything this job emits is likewise derived from files in
      # the checkout, not from the tag's free text.
      #
      # PyYAML is installed on demand exactly as matrix-coverage above (and pr.yml's
      # workflow-integrity) do it; tomllib is stdlib from 3.11 and ubuntu-latest ships 3.12.
      - name: Resolve the tag to a package, and require the manifest to agree with it
        id: plan
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 -c "import yaml" 2>/dev/null || pip install --quiet --disable-pip-version-check --only-binary :all: "pyyaml==6.0.3"
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          import secrets
          import sys
          import tomllib

          import yaml

          TAG = os.environ["TAG"]
          PREFIX = "integration-"
          GRAMMAR = "integration-<directory-slug>-v<version>, e.g. integration-langgraph-v0.1.0"


          def fail(message):
              print(f"::error::{message}")
              sys.exit(1)


          # Only jobs["..."] is read, never wf["on"] — YAML 1.1 parses a bare `on:` key as the
          # boolean True, which is a trap for anything that tries to look the trigger up by name.
          wf = yaml.safe_load(open(".github/workflows/integrations.yml", encoding="utf-8"))

          # slug -> (toolchain matrix that claims it, that leg). The same static read matrix-coverage
          # performs, and the reason the matrices above must stay static `include:` lists.
          claimed = {}
          legs = {}
          for job in ("typescript", "python", "dotnet"):
              for leg in wf["jobs"][job]["strategy"]["matrix"]["include"]:
                  claimed[leg["slug"]] = job
                  legs[leg["slug"]] = leg

          if not TAG.startswith(PREFIX):
              fail(
                  f"release tag {TAG!r} does not start with {PREFIX!r}. The grammar is {GRAMMAR}."
              )
          rest = TAG[len(PREFIX):]

          # Enumerate EVERY '-v' split point rather than trusting one regex to find "the" boundary.
          # A slug is a directory name and may itself contain '-v' one day, and a version may contain
          # '-v' in a pre-release segment, so the boundary is genuinely ambiguous from the string
          # alone. Disambiguation is done against disk: a split survives only if its left half is a
          # real integrations/ directory that also has a matrix leg. Requiring exactly one survivor
          # is what turns prefix shadowing (see the `tags:` comment in the trigger) from a silent
          # mis-publish into a hard failure.
          candidates = []
          for match in re.finditer("-v", rest):
              slug, version = rest[: match.start()], rest[match.end():]
              if not slug or not version:
                  continue
              if (pathlib.Path("integrations") / slug).is_dir() and slug in claimed:
                  candidates.append((slug, version))

          if not candidates:
              fail(
                  f"release tag {TAG!r} does not name any package that exists under integrations/ "
                  f"AND has a matrix leg in this workflow. The grammar is {GRAMMAR}, where the slug "
                  f"is the DIRECTORY name under integrations/ — not the registry package name "
                  f"(integrations/vercel-ai-sdk publishes as @cortadel/vercel-ai-provider). Known "
                  f"slugs: {', '.join(sorted(claimed))}."
              )
          if len(candidates) > 1:
              readable = "; ".join(f"slug {s!r} + version {v!r}" for s, v in candidates)
              fail(
                  f"release tag {TAG!r} is ambiguous — it decomposes into more than one valid "
                  f"package/version pair ({readable}), so which package it releases cannot be "
                  f"decided. Rename one of the colliding directories, or cut a tag that is "
                  f"unambiguous."
              )

          slug, version = candidates[0]
          package = pathlib.PurePosixPath("integrations") / slug
          directory = pathlib.Path(package)

          # Toolchain from the manifest on disk, never from the matrix — same derivation
          # matrix-coverage uses, and for the same reason: a package listed under the wrong toolchain
          # would otherwise be published by the wrong registry job.
          on_disk = []
          if (directory / "package.json").is_file():
              on_disk.append("typescript")
          if (directory / "pyproject.toml").is_file():
              on_disk.append("python")
          if any(directory.glob("*.slnx")):
              on_disk.append("dotnet")
          if len(on_disk) != 1:
              fail(
                  f"{slug}: expected exactly one toolchain manifest under {package} "
                  f"(package.json / pyproject.toml / *.slnx), found {on_disk or 'none'}. Refusing to "
                  f"guess which registry this release belongs to."
              )
          toolchain = on_disk[0]
          if toolchain != claimed[slug]:
              fail(
                  f"{slug} is a {toolchain} package on disk but is listed in the {claimed[slug]} "
                  f"matrix. Fix the matrix before releasing — matrix-coverage explains this failure "
                  f"in full."
              )

          package_project = ""
          dotnet_version = ""
          python_version = ""

          if toolchain == "typescript":
              manifest = json.loads((directory / "package.json").read_text(encoding="utf-8"))
              if manifest.get("private"):
                  fail(f"{slug}: package.json sets \"private\": true — npm refuses to publish it.")
              package_name = manifest.get("name")
              manifest_version = manifest.get("version")
              manifest_path = f"{package}/package.json"
          elif toolchain == "python":
              project = tomllib.loads(
                  (directory / "pyproject.toml").read_text(encoding="utf-8")
              )["project"]
              # A dynamic version would make the read below meaningless — the value shipped would be
              # computed at build time and could differ from anything in the file. None of the three
              # declares one today; this fails loudly rather than silently comparing against None.
              if "version" in (project.get("dynamic") or []):
                  fail(
                      f"{slug}: pyproject.toml declares a dynamic version, so the tag cannot be "
                      f"checked against the manifest. Pin project.version, or teach this job how to "
                      f"resolve the dynamic source."
                  )
              package_name = project.get("name")
              manifest_version = project.get("version")
              manifest_path = f"{package}/pyproject.toml"
              # Build on the interpreter the package itself declares as its floor — the same value
              # the matrix leg pins, and one matrix-coverage already keeps in agreement with the
              # manifest, so this cannot drift into building on an interpreter the lock excludes.
              floors = re.findall(r">=\s*(\d+\.\d+)", project["requires-python"])
              if len(floors) != 1:
                  fail(
                      f"{slug}: cannot read a single '>=' lower bound out of requires-python = "
                      f"{project['requires-python']!r}; this job needs one to choose an interpreter."
                  )
              python_version = floors[0]
          else:
              leg = legs[slug]
              package_project = str(leg["package-project"])
              dotnet_version = str(leg["dotnet-version"])
              csproj = (directory / package_project).read_text(encoding="utf-8")
              # Element form only: `<Version>` never matches `<AssemblyVersion>` or a
              # `<PackageReference ... Version="..."/>` attribute.
              ids = re.findall(r"<PackageId>([^<]+)</PackageId>", csproj)
              versions = re.findall(r"<Version>([^<]+)</Version>", csproj)
              if len(ids) != 1 or len(versions) != 1:
                  fail(
                      f"{slug}: expected exactly one <PackageId> and one <Version> in "
                      f"{package}/{package_project}, found {len(ids)} and {len(versions)}. The "
                      f"version that ships is whatever the csproj says — it is NOT derived from the "
                      f"tag — so this job has to be able to read it unambiguously."
                  )
              package_name, manifest_version = ids[0].strip(), versions[0].strip()
              manifest_path = f"{package}/{package_project}"

          if not package_name or not manifest_version:
              fail(f"{slug}: could not read a package name and version out of {manifest_path}.")

          # THE GATE. Exact string equality, deliberately — not a normalised or semver-parsed
          # comparison. A looser check would let `integration-crewai-v0.1` publish `0.1.0`, which is
          # exactly the class of surprise this exists to stop. (PyPI normalises PEP 440 and nuget.org
          # normalises SemVer on their own side; that is their business. What this asserts is that
          # the human who cut the tag and the manifest that will be published agree literally.)
          if manifest_version != version:
              fail(
                  f"tag {TAG!r} says version {version!r}, but {manifest_path} declares "
                  f"{manifest_version!r}. A tag must never be able to publish a version other than "
                  f"the one in the manifest. Fix whichever is wrong — and note that all three "
                  f"registries are append-only and none of them lets a version be reused, so a "
                  f"wrong version published here cannot be taken back."
              )

          # Heredoc-delimited, not bare `key=value`. package-name and package-project are read out
          # of a manifest, and GITHUB_OUTPUT is line-oriented: a value containing a newline written
          # as `key=value` would be parsed as the first line's value followed by whatever the rest
          # of the value happened to look like, letting a manifest declare additional job outputs.
          # It takes a merged malicious manifest plus a release tag to reach, which is a high bar —
          # but the heredoc form closes it outright, and a random per-value delimiter (asserted
          # absent from the value) means the encoding cannot be escaped either.
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              for key, value in (
                  ("slug", slug),
                  ("version", version),
                  ("toolchain", toolchain),
                  ("package-name", package_name),
                  ("package-project", package_project),
                  ("python-version", python_version),
                  ("dotnet-version", dotnet_version),
              ):
                  delimiter = f"ghadelim-{secrets.token_hex(16)}"
                  if delimiter in value:
                      fail(f"refusing to write output {key!r}: it contains the random delimiter.")
                  handle.write(f"{key}<<{delimiter}\n{value}\n{delimiter}\n")

          print(
              f"{TAG} -> {package_name} {manifest_version} ({toolchain}, integrations/{slug}); "
              f"tag and manifest agree."
          )
          PY

  publish-npm:
    name: publish ${{ needs.release-plan.outputs.package-name }} to npm
    needs: [release-plan, matrix-coverage, typescript]
    if: needs.release-plan.outputs.toolchain == 'typescript'
    concurrency:
      group: integrations-publish-npm-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Provenance TODAY (the Sigstore/OIDC attestation --provenance produces), and the publish
      # credential itself AFTER the trusted-publishing migration below. Same permission, two
      # different jobs over time — worth stating so it is never mistaken for the latter while the
      # NPM_TOKEN_INTEGRATIONS secret is still in play.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm/action-setup before actions/setup-node: setup-node's `cache: pnpm` shells out to
      # `pnpm store path`, so pnpm has to exist first. Same order as the typescript matrix above.
      #
      # pnpm stays on 10, and the reason is the same delegation the setup-node comment below turns
      # on. pnpm 10's `pnpm publish` packs a tarball and then shells out to `npm publish`, so npm's
      # OIDC flow is what authenticates. pnpm 11 reimplemented publish natively and stopped
      # delegating, which took npm's OIDC flow out of the path: actions/setup-node writes
      # `_authToken=${NODE_AUTH_TOKEN}` into the .npmrc it manages, and with no token set pnpm
      # 11.0.8 forwarded that placeholder verbatim as `Authorization: Bearer ${NODE_AUTH_TOKEN}`, so
      # the registry answered 404 (pnpm/pnpm#11513). pnpm's own maintainers state the mechanism in
      # the fix: "This worked in v10 because `pnpm publish` shelled out to `npm publish`, whose own
      # OIDC flow handled the case" (pnpm/pnpm#11526, merged 2026-05-15 — it makes an unresolved
      # ${VAR} resolve to '' so OIDC is left as the sole auth source).
      #
      # Do not float to 11 on the strength of that fix. It is merged, but its own test plan leaves
      # "verify the fix resolves the OIDC publish flow on a next-release build" UNCHECKED, and a 404
      # on a publish is indistinguishable at a glance from "package does not exist", so the
      # regression misdiagnoses badly. Moving to 11 would also move the OIDC implementation from npm
      # to pnpm, which makes the npm floor reasoned about below moot and demands a fresh §1.5
      # rehearsal — so it is a migration, not a version bump.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # 24.x, and deliberately NOT the package's own engines.node floor — the one place in this
          # file that does not run at the floor. Every matrix leg above does, which is what proves
          # the package works there; this job is not testing the package, it is talking to the
          # registry. So this pin answers the REGISTRY's requirements, not the package's.
          #
          # The version that matters here is the npm CLI's, because `pnpm publish` on pnpm 10 does
          # not talk to the registry itself. It packs a tarball and shells out to npm:
          #     runNpm(opts.npmPath, ["publish", "--ignore-scripts", basename(tarballPath), ...args])
          # where runNpm is `const npm = npmPath ?? "npm"` spawned through cross-spawn — i.e.
          # whatever npm actions/setup-node just put on PATH. (Read out of pnpm 10.30.0's own
          # bundle, dist/pnpm.cjs, module plugin-commands-publishing/lib/publish.js.) That bundle
          # contains no OIDC code at all — zero occurrences of "oidc", "id-token" or
          # ACTIONS_ID_TOKEN_REQUEST — so the trusted-publishing exchange is npm's, start to finish.
          # `--access public --provenance` are passed straight through as well: pnpm strips only its
          # own flags (--no-git-checks, --embed-readme, --publish-branch, --npm-path), so npm is
          # already the tool implementing --provenance during the token phase too.
          #
          # npm's floor therefore binds: trusted publishing requires npm >= 11.5.1 AND Node >=
          # 22.14.0 (docs.npmjs.com/trusted-publishers). '22.x' cannot satisfy it. Measured across
          # the whole of nodejs.org/dist/index.json on 2026-08-14, so the next person need not:
          #     Node 20.x -> npm  9.6.4 … 10.8.2    (newest v20.20.2 -> npm 10.8.2)
          #     Node 22.x -> npm 10.5.1 … 10.9.8    (newest v22.23.2 -> npm 10.9.8)
          #     Node 24.x -> npm 11.3.0 … 11.17.0   (newest v24.19.0 -> npm 11.17.0)
          # Exactly ZERO of the 35 Node 22 releases ship an npm 11 of any kind, and no future 22
          # patch will — npm 11 arrived with the 24 line. setup-node resolves '<major>.x' to the
          # newest release of that major, so '22.x' lands on npm 10.9.8, below the floor, while
          # '24.x' lands on npm 11.17.0, comfortably above it.
          #
          # Why 24.x specifically, over the alternatives:
          #   * a pinned Node 24 minor: goes stale, and is a live trap rather than a safe choice —
          #     the first eight Node 24 releases ship npm 11.3.0…11.4.2, BELOW the floor (v24.5.0 ->
          #     npm 11.5.1 is the first that clears it). '24.x' always resolving to the newest is
          #     precisely what keeps this correct without maintenance.
          #   * '22.x' plus `npm install -g npm@^11.5.1`: would work, but adds an unpinned network
          #     install immediately before an irreversible publish, on the one job in this file that
          #     holds a write credential. Not worth it to preserve a number.
          #   * '25.x': also clears the floor (npm 11.6.2…11.12.1) but is not LTS. 24 is the current
          #     LTS (Krypton); 22 (Jod) is in maintenance and 20 reached EOL 2026-04-30.
          # 24 also clears the Node >= 22.14.0 half of npm's floor and pnpm 10's engines.node
          # of >=18.12.
          #
          # NOTE the earlier revision of this comment that claimed the opposite — that this job
          # "publishes with pnpm and never invokes npm at all, so npm's version is irrelevant" — and
          # do not restore it. It is backwards: pnpm 10 delegates, which is the whole reason npm's
          # floor reaches this line.
          #
          # None of this endangers the FIRST release. Phases 1-3 are token-authenticated and a token
          # publish with --provenance works fine on npm 10.9.x; the floor binds at phase 4, the
          # migration to trusted publishing, where too old an npm surfaces as a bare 404 that reads
          # like "package does not exist". Corrected here in advance so that misdiagnosis never
          # happens.
          #
          # And a correct pin is still only a necessary condition, never a proof: §1.5's "bump one
          # package to 0.1.1 and tag it" rehearsal stays mandatory, because only a publish that
          # actually used the OIDC path demonstrates that the OIDC path works.
          node-version: '24.x'
          # registry-url makes setup-node write an .npmrc that reads the auth token from
          # $NODE_AUTH_TOKEN, which the publish step sets. It also points the CLI at
          # registry.npmjs.org, which is why npm's own trusted-publishing recipe keeps this input
          # after dropping the token — see the migration note on the publish step.
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
          # Repo-root-relative, like the matrix legs' own — not resolved against a working-directory.
          cache-dependency-path: integrations/${{ needs.release-plan.outputs.slug }}/pnpm-lock.yaml

      # A fresh build from the tag ref rather than an artifact downloaded from the matrix job — the
      # same convention all three SDK publish jobs follow (typescript.yml re-runs `pnpm run build`,
      # python.yml re-runs its build, dotnet.yml re-runs `dotnet pack`).
      # --ignore-scripts: see the typescript matrix job's comment on why this is safe here. It
      # governs dependency lifecycle hooks only, so `pnpm run build` (including
      # n8n-nodes-cortadel's `tsc + node scripts/copy-assets.mjs`) still runs normally.
      - name: Install and build from the tagged commit
        working-directory: integrations/${{ needs.release-plan.outputs.slug }}
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run build

      # The artifact-level half of the version gate, and the npm counterpart of the py.typed and
      # .nupkg-contents checks the matrix jobs above run. A build that silently produced nothing
      # would publish a real, permanent, EMPTY package — and npm never lets that version be reused.
      # Packing into RUNNER_TEMP rather than the package directory keeps the tarball out of the tree
      # the publish step then packs.
      #
      # What is asserted present is read out of each package's own `files` array, not hard-coded.
      # Seven of the eight declare `files: ["dist"]`, but @cortadel/openclaw declares
      # `["dist", "openclaw.plugin.json"]` — its plugin manifest is a shipped artefact, and a
      # dist-only check would have called a tarball missing it green, publishing a permanently
      # broken OpenClaw plugin. Deriving the assertion from the manifest means the ninth package to
      # declare a ninth extra file is covered on the day it is added rather than the day it breaks.
      - name: Pack and verify the tarball that is about to be published
        working-directory: integrations/${{ needs.release-plan.outputs.slug }}
        env:
          EXPECTED_NAME: ${{ needs.release-plan.outputs.package-name }}
          EXPECTED_VERSION: ${{ needs.release-plan.outputs.version }}
        run: |
          rm -rf "$RUNNER_TEMP/packcheck" && mkdir -p "$RUNNER_TEMP/packcheck"
          pnpm pack --pack-destination "$RUNNER_TEMP/packcheck"
          python3 - <<'PY'
          import fnmatch
          import glob
          import itertools
          import json
          import os
          import sys
          import tarfile

          # A dedicated, freshly-emptied directory rather than RUNNER_TEMP itself, so the
          # exactly-one-tarball assertion below is about what pnpm just produced and cannot be
          # confused by anything else a step left in the runner's temp directory.
          tarballs = sorted(glob.glob(os.path.join(os.environ["RUNNER_TEMP"], "packcheck", "*.tgz")))
          if len(tarballs) != 1:
              sys.exit(f"expected exactly one packed tarball, found {tarballs}")

          # Only files count as evidence that a declared path shipped; directory members are
          # filtered out. pnpm 10.30's own tarballs happen to contain no directory entries at all
          # (verified against a real `pnpm pack` of @cortadel/openclaw: 31 members, 31 of them
          # files), so today this filter changes nothing. It is here because the check must not
          # depend on that: a packer that did emit `package/dist` as a member — npm's own `pack`
          # among them — would otherwise let an empty dist/ satisfy `files: ["dist"]`, which is the
          # exact failure this step exists to catch.
          with tarfile.open(tarballs[0]) as archive:
              members = archive.getmembers()
              manifest = json.load(archive.extractfile("package/package.json"))
          shipped = [m.name[len("package/"):] for m in members
                     if not m.isdir() and m.name.startswith("package/")]

          problems = []
          if manifest.get("name") != os.environ["EXPECTED_NAME"]:
              problems.append(
                  f"name is {manifest.get('name')!r}, expected {os.environ['EXPECTED_NAME']!r}"
              )
          if manifest.get("version") != os.environ["EXPECTED_VERSION"]:
              problems.append(
                  f"version is {manifest.get('version')!r}, expected "
                  f"{os.environ['EXPECTED_VERSION']!r}"
              )

          # `files` is what npm ships, so `files` is what gets asserted. Requiring it to be a
          # non-empty list is part of the check, not a formality: a package that omits it ships its
          # whole working directory and would leave this loop with nothing to verify.
          declared = manifest.get("files")
          if not isinstance(declared, list) or not declared:
              problems.append(
                  f"package.json declares `files` as {declared!r}; this job needs a non-empty list "
                  f"to know what the tarball is supposed to contain"
              )
              declared = []

          def globs(pattern):
              """Every fnmatch pattern that should count as this npm pattern.

              npm matches `files` with minimatch, where a `**/` segment means "zero or more
              directories". fnmatch has no such notion and would force `dist/**/*.js` to match at
              least one intermediate directory, failing a perfectly good `dist/index.js`. Emitting
              both the present and the elided form of every `**/` restores the zero-directories
              case. The remaining deviations all run the other way — fnmatch's `*` and `?` cross
              `/` where minimatch's do not — so a glob entry can end up under-constrained here, but
              never rejected when npm itself would have been satisfied.
              """
              parts = pattern.split("**/")
              return {
                  parts[0] + "".join(sep + part for sep, part in zip(combo, parts[1:]))
                  for combo in itertools.product(("**/", ""), repeat=len(parts) - 1)
              }

          for entry in declared:
              # A negation only ever subtracts from the set, so there is nothing to require present.
              if entry.startswith("!"):
                  continue
              want = entry
              while want.startswith("./"):
                  want = want[2:]
              # lstrip("/") and not lstrip("./"): the latter would also eat the leading dot of a
              # legitimately dot-prefixed entry and quietly stop matching it.
              want = want.lstrip("/").rstrip("/")
              if not want:
                  continue
              # Three ways to satisfy an entry: it names a file exactly; it names a directory with
              # at least one file inside it; or it is a glob something matches. The first two are
              # the only forms any of the eight packages uses today, and both are matched exactly.
              patterns = globs(want)
              if any(name == want or name.startswith(want + "/")
                     or any(fnmatch.fnmatchcase(name, p) for p in patterns)
                     for name in shipped):
                  continue
              problems.append(
                  f"`files` declares {entry!r} but the tarball contains no file matching it, so "
                  f"this would publish a package missing something it promises to ship — "
                  f"permanently, at a version npm will never let you reuse"
              )

          if problems:
              sys.exit(f"{tarballs[0]} is wrong: " + "; ".join(problems))

          print(f"{tarballs[0]}: {manifest['name']} {manifest['version']}, "
                f"{len(shipped)} files, files={declared} all present")
          PY

      # npm has no `--skip-duplicate` / `skip-existing` flag (nuget.org and PyPI both do, and the
      # jobs below use them), so idempotency on a re-run has to be built by hand. It matters here
      # specifically because the provenance assertion further down runs AFTER an irreversible
      # publish: without this, one flaky attestation lookup would leave every subsequent re-run
      # permanently red on EPUBLISHCONFLICT with no way to reach the check again.
      # Both URL shapes were verified against the live registry: a scoped name works unencoded, and
      # a missing version returns 404 rather than an error page.
      - name: Is this version already on the registry?
        id: registry
        env:
          PACKAGE: ${{ needs.release-plan.outputs.package-name }}
          VERSION: ${{ needs.release-plan.outputs.version }}
        run: |
          status="$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/${PACKAGE}/${VERSION}")"
          case "$status" in
            200)
              echo "::notice::${PACKAGE}@${VERSION} is already on the registry — skipping the publish step and going straight to the provenance check."
              echo "published=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "${PACKAGE}@${VERSION} is not on the registry yet."
              echo "published=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::registry.npmjs.org answered HTTP ${status} for ${PACKAGE}@${VERSION}. Refusing to publish without knowing whether this version already exists — npm never lets a version be reused, so guessing here is not recoverable."
              exit 1
              ;;
          esac

      # --access public is mandatory, not cosmetic: seven of the eight are scoped and npm defaults
      # scoped packages to restricted (each package.json's publishConfig.access already says the
      # same; passing it explicitly keeps this step self-documenting). --provenance attaches the
      # signed Sigstore attestation, and needs the id-token: write permission above. --no-git-checks:
      # this job checks out a tag ref (detached HEAD), which pnpm's default git checks would reject —
      # the checkout plus the `needs:` gates are what vouch for this commit instead.
      #
      # ── MIGRATING THIS STEP TO TRUSTED PUBLISHING ────────────────────────────────────────────────
      # The token below exists only because npm trusted publishing cannot bootstrap a package that
      # does not yet exist ("Package must exist" is a documented prerequisite; npm/cli#8544 is open).
      # Once all eight packages exist and a human has attached a trusted publisher to each
      # (`npm trust github <pkg> --allow-publish ...`, an interactive step that cannot be done from
      # CI — see .github/RELEASING.md), this step becomes exactly two deletions:
      #     1. delete the `env:` block below (NODE_AUTH_TOKEN / NPM_TOKEN_INTEGRATIONS);
      #     2. delete ` --provenance` from the command — with trusted publishing the CLI generates
      #        and publishes the attestation itself, and passing the flag is not how it is done.
      # Keep `registry-url` on setup-node; npm's own recipe keeps it and simply omits the token.
      # Then delete the NPM_TOKEN_INTEGRATIONS repository secret and revoke the token itself. This is
      # not optional housekeeping: npm caps write-permission granular tokens at 90 days, so a
      # token-based release path has a built-in expiry that will break a release at the worst
      # possible moment. The secret is deliberately NOT named NPM_TOKEN — that name belongs to
      # typescript.yml's SDK release, and this one has to be broader (npm's package picker cannot
      # select packages that do not exist yet, so the bootstrap token must cover "All Packages" to
      # reach both @cortadel/* and the unscoped n8n-nodes-cortadel).
      - name: Publish to npm
        if: steps.registry.outputs.published == 'false'
        working-directory: integrations/${{ needs.release-plan.outputs.slug }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN_INTEGRATIONS }}
        run: pnpm publish --access public --provenance --no-git-checks

      # Provenance is asserted, not assumed, because it has already silently failed once in this
      # repository: @cortadel/sdk@1.0.0 has NO attestation
      # (registry.npmjs.org/-/npm/v1/attestations/@cortadel/sdk@1.0.0 → 404, reproduced against the
      # live registry) despite publishConfig.provenance being set and typescript.yml's publish step
      # passing --provenance. Its recorded _nodeVersion/_npmVersion do not match that workflow's pin
      # either, so that release was almost certainly published by hand. Nothing in CI noticed. This
      # step is what makes the same failure impossible to miss here, in both the token phase and the
      # trusted-publishing phase (which produces attestations automatically).
      #
      # It runs after an irreversible publish, so it cannot prevent a provenance-less release — it
      # can only refuse to report one as green. The retry loop absorbs registry propagation delay;
      # a genuine miss still fails, and the re-run path is safe because the publish step above is
      # skipped once the version exists.
      - name: Verify the published version actually carries provenance
        env:
          PACKAGE: ${{ needs.release-plan.outputs.package-name }}
          VERSION: ${{ needs.release-plan.outputs.version }}
        run: |
          status="000"
          for i in $(seq 1 10); do
            # `|| true` plus the empty-guard, because this step runs under `bash -e` and curl exits
            # non-zero on a connection or DNS failure — without it a single network blip would abort
            # the step instead of entering the retry loop, turning a transient fault into a red
            # release on a package that is already published and cannot be republished. The --retry
            # flags handle the recoverable cases inside curl first; %{http_code} is 000 whenever no
            # HTTP response was received, which is neither 200 nor a reason to stop looping.
            status="$(curl -sS --retry 3 --retry-connrefused --retry-all-errors -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/-/npm/v1/attestations/${PACKAGE}@${VERSION}" || true)"
            [ -n "$status" ] || status="000"
            if [ "$status" = "200" ]; then
              echo "${PACKAGE}@${VERSION} has a published provenance attestation."
              exit 0
            fi
            echo "waiting for the attestation to appear (http $status) ($i/10)..."
            sleep 15
          done
          echo "::error::${PACKAGE}@${VERSION} IS PUBLISHED but has no provenance attestation (last HTTP ${status} from /-/npm/v1/attestations). The release cannot be undone — npm never lets a version be reused — so treat this as a broken release path, not a broken package: check that the publish step really ran with --provenance (or, post-migration, that a trusted publisher is attached), and that id-token: write is still set on this job. @cortadel/sdk@1.0.0 has exactly this defect."
          exit 1

  publish-pypi:
    name: publish ${{ needs.release-plan.outputs.package-name }} to PyPI
    needs: [release-plan, matrix-coverage, python]
    if: needs.release-plan.outputs.toolchain == 'python'
    concurrency:
      group: integrations-publish-pypi-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # NO `id-token: write`, and its absence is the point rather than an oversight. This job
      # authenticates to PyPI with the PYPI_TOKEN API token (see the publish step), so nothing here
      # ever performs an OIDC exchange: pypa/gh-action-pypi-publish only takes its trusted-publishing
      # path when `user` is __token__ AND `password` is empty, and a non-empty password also
      # force-disables the PEP 740 attestation step that would otherwise want an OIDC identity. This
      # job therefore mints no token, signs nothing, and needs no privilege beyond reading the tree.
      # (publish-npm and publish-nuget above/below still hold `id-token: write` — they genuinely use
      # it, for Sigstore provenance and the NuGet/login exchange respectively.)
      contents: read
    # No `environment:` block, and this is a deliberate choice rather than an omission — but note the
    # reason is now purely GitHub-side. With token authentication there is no registry-side
    # "Environment name" field to keep in agreement, because there is no publisher registered on
    # pypi.org at all; an Environment here would be exactly one thing, a human approval gate.
    # It is still left off, because this repository has already been bitten by the other half of that
    # trap: python.yml's publish-pypi records a job pinned to an environment that did not exist ("a
    # protection rule with no environment to satisfy it never resolves"). .github/RELEASING.md §5
    # documents adding one as optional hardening.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # The package's own declared requires-python floor, resolved by release-plan — the same
          # value the matrix leg pins, and one matrix-coverage already keeps in agreement with the
          # manifest. Hard-coding a version here would add a fourth place for that floor to drift.
          python-version: ${{ needs.release-plan.outputs.python-version }}
          enable-cache: true
          # Repo-root-relative, like the python matrix leg's own — NOT resolved against the job's
          # working-directory.
          cache-dependency-glob: integrations/${{ needs.release-plan.outputs.slug }}/uv.lock

      # The matrix leg's install split, minus `--extra test` (nothing here runs the suite; the
      # `python` job already did, on this exact commit). `--group build` is what puts hatchling and
      # editables in the venv so the build below can run --no-build-isolation; --no-install-project
      # keeps the package itself uninstalled; --no-build blocks third-party sdist build hooks;
      # --locked asserts uv.lock is already consistent with pyproject.toml. Verified locally on
      # integrations/pydantic-ai that dropping --extra test leaves this exact chain working.
      - name: Sync the build backend from the lockfile
        working-directory: integrations/${{ needs.release-plan.outputs.slug }}
        run: uv sync --group build --no-install-project --no-build --locked

      # `uv build --no-build-isolation`, identical to the matrix leg's own step and for the identical
      # reason: without the flag, uv provisions throwaway build environments and resolves hatchling
      # and friends from PyPI unpinned and unhashed on every run (the matrix job's comment records
      # the measurement). A fresh build from the tag ref rather than an artifact from the matrix job,
      # matching every SDK publish job's convention.
      - name: Build sdist and wheel
        working-directory: integrations/${{ needs.release-plan.outputs.slug }}
        run: uv build --sdist --wheel --no-build-isolation .

      # The artifact-level half of the version gate. Both filenames encode the normalised project
      # name and the version (verified locally: cortadel_pydantic_ai-0.1.0.tar.gz and
      # cortadel_pydantic_ai-0.1.0-py3-none-any.whl), so this catches a build that produced something
      # other than what the tag promised — before the upload, which PyPI can never take back: it
      # refuses to reuse a version AND refuses to reuse a filename, "even once a project has been
      # deleted and recreated".
      - name: Assert both artifacts carry the tagged version
        working-directory: integrations/${{ needs.release-plan.outputs.slug }}
        env:
          EXPECTED_VERSION: ${{ needs.release-plan.outputs.version }}
        run: |
          python3 - <<'PY'
          import glob
          import os
          import sys

          version = os.environ["EXPECTED_VERSION"]
          artifacts = sorted(glob.glob("dist/*"))
          wheels = [a for a in artifacts if a.endswith(".whl")]
          sdists = [a for a in artifacts if a.endswith(".tar.gz")]
          if len(wheels) != 1 or len(sdists) != 1:
              sys.exit(f"expected exactly one wheel and one sdist under dist/, found {artifacts}")

          # PEP 427/625 filenames are `<name>-<version>[-...]`, so the version is delimited by '-'
          # on the left and by '-' or '.' on the right; a bare substring test would accept 0.1.0
          # inside 10.1.0rc1.
          for artifact in (wheels[0], sdists[0]):
              stem = os.path.basename(artifact)
              if f"-{version}-" not in stem and not stem.endswith(f"-{version}.tar.gz"):
                  sys.exit(
                      f"{artifact} does not carry version {version!r} — the tag and the built "
                      f"artifact disagree. PyPI never lets a version or even a filename be reused, "
                      f"so this must be fixed before the upload, not after."
                  )
          print(f"dist/ carries version {version}: {', '.join(artifacts)}")
          PY

      # pypa/gh-action-pypi-publish's own documented non-Trusted-Publishing mode, and deliberately
      # the same action, the same pinned SHA and the same inputs python.yml's publish-pypi uses to
      # release the `cortadel` SDK: __token__ as the username, an API token as the password.
      #
      # The token is the account-scoped PYPI_TOKEN repository secret, which already exists — this job
      # does not create or rotate it (the repo owner provisions it), and PyPI needs no other
      # registry-side setup before the first tag. Account-scoped is what makes this work at all here:
      # all three Python packages are brand new, and creating a project that does not exist yet is
      # precisely what a project-scoped token cannot do. See .github/RELEASING.md §2.
      #
      # Two consequences of the token path, read out of the action's own twine-upload.sh at the SHA
      # pinned below rather than assumed:
      #   * the OIDC exchange is skipped outright — `TRUSTED_PUBLISHING` is true only when
      #     `user` is __token__ AND `password` is empty, so a non-empty password sends the script
      #     down the "user-provided API token" branch and never runs oidc-exchange.py. That is why
      #     this job carries no `id-token: write`.
      #   * PEP 740 attestations are force-disabled (`if ! "${TRUSTED_PUBLISHING}"` sets
      #     INPUT_ATTESTATIONS=false, because attestations currently require trusted publishing),
      #     regardless of the `attestations` input's own `true` default. So no attestation appears on
      #     the project page. That is the token path working as designed, not a misconfiguration —
      #     and it is the one thing the trusted-publishing follow-up in this file's header would buy.
      #
      # packages-dir is repo-root-relative (like python.yml's `sdk/python/dist`), not relative to any
      # working-directory. skip-existing keeps a retried run idempotent after an infra flake.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          user: __token__
          password: ${{ secrets.PYPI_TOKEN }}
          packages-dir: integrations/${{ needs.release-plan.outputs.slug }}/dist
          skip-existing: true

  # ────────────────────────────────────────────────────────────────────────────────────────────────
  # This is where `publish-nuget` used to be. It published `Cortadel.AgentFramework` from this file
  # and could never work: a nuget.org trusted-publishing policy is keyed on (package owner,
  # repository owner, repository, WORKFLOW FILE, environment) and the `cortadel` account's policy
  # names `dotnet.yml`, so the OIDC exchange 401'd with "Workflow mismatch for policy 'cortadel':
  # expected 'dotnet.yml', actual 'integrations.yml'". The publish now lives in
  # .github/workflows/dotnet.yml (`integration-release-plan` + `publish-nuget-integration`), which
  # also builds and tests the package from its own folder-local Cortadel.AgentFramework.slnx. The
  # full story, and the checklist for moving it back once a policy naming this file exists, are in
  # this file's header and .github/RELEASING.md §3.
  #
  # This job replaces it rather than the job simply being deleted, and it is deliberately NOT a
  # publisher: no `id-token: write`, no registry call, no credential of any kind. It exists to close
  # the one hole the move opens. dotnet.yml is triggered by a tag pattern naming ONE package
  # (`integration-microsoft-agent-framework-v*`), while this file's trigger is the permissive
  # `integration-*-v*` glob — so a second .NET integration added later would tag, resolve cleanly
  # here, find no publish job on either side, and finish GREEN having published nothing. That failure
  # is silent and would be discovered by a user, not by CI. So this job re-reads dotnet.yml's own
  # `tags:` patterns and fails the release if none of them covers the tag being built.
  #
  # It intentionally does not `needs:` matrix-coverage or the dotnet matrix: it publishes nothing, so
  # gating it on the suite would only delay a signpost. dotnet.yml runs the package's tests itself
  # before it pushes.
  # ────────────────────────────────────────────────────────────────────────────────────────────────
  nuget-release-moved:
    name: .NET releases publish from dotnet.yml — check that tag is covered there
    needs: [release-plan]
    if: needs.release-plan.outputs.toolchain == 'dotnet'
    concurrency:
      group: integrations-nuget-release-moved-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reads the checked-out tree and nothing else. The `id-token: write` this job's predecessor
    # carried is gone with the publish it fed, and belongs in dotnet.yml now.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The tag arrives through the environment, never interpolated into the shell — same rule
      # release-plan states. PyYAML is installed on demand exactly as the jobs above do it.
      - name: Confirm dotnet.yml's tag patterns cover this release
        env:
          TAG: ${{ github.ref_name }}
          SLUG: ${{ needs.release-plan.outputs.slug }}
          PACKAGE_NAME: ${{ needs.release-plan.outputs.package-name }}
          VERSION: ${{ needs.release-plan.outputs.version }}
        run: |
          python3 -c "import yaml" 2>/dev/null || pip install --quiet --disable-pip-version-check --only-binary :all: "pyyaml==6.0.3"
          python3 - <<'PY'
          import os
          import re
          import sys

          import yaml

          TAG = os.environ["TAG"]
          SLUG = os.environ["SLUG"]
          PACKAGE_NAME = os.environ["PACKAGE_NAME"]
          VERSION = os.environ["VERSION"]
          DOTNET_WORKFLOW = ".github/workflows/dotnet.yml"

          wf = yaml.safe_load(open(DOTNET_WORKFLOW, encoding="utf-8"))

          # YAML 1.1 parses a bare `on:` key as the boolean True — the trap every other reader in
          # this repository documents. Both spellings are accepted here rather than assuming which
          # one this parser produced, so a future PyYAML/spec change cannot turn this check into a
          # silent pass.
          trigger = wf.get("on", wf.get(True)) or {}
          patterns = ((trigger.get("push") or {}).get("tags")) or []
          if isinstance(patterns, str):
              patterns = [patterns]
          if not patterns:
              print(
                  f"::error::{DOTNET_WORKFLOW} declares no push tag patterns at all, so nothing "
                  f"publishes {PACKAGE_NAME}. The NuGet publish lives there because the nuget.org "
                  f"policy is bound to that filename — see this workflow's header."
              )
              sys.exit(1)


          def covers(pattern, tag):
              """Approximate GitHub's ref filter matching.

              `*` matches any run of characters except `/`, `**` matches across `/`, and `?` matches
              one non-`/` character. Ref *names* here never contain `/`, so the approximation is
              exact for this use; it is written out rather than delegated to fnmatch because
              fnmatch's `*` crosses `/` and `[...]` classes would be interpreted, neither of which
              matches GitHub's grammar.
              """
              regex = ""
              index = 0
              while index < len(pattern):
                  char = pattern[index]
                  if char == "*":
                      if pattern.startswith("**", index):
                          regex += ".*"
                          index += 2
                          continue
                      regex += "[^/]*"
                  elif char == "?":
                      regex += "[^/]"
                  else:
                      regex += re.escape(char)
                  index += 1
              return re.fullmatch(regex, tag) is not None


          matched = [p for p in patterns if covers(p, TAG)]
          if not matched:
              print(
                  f"::error::Tag {TAG!r} releases {PACKAGE_NAME} {VERSION} (integrations/{SLUG}), a "
                  f".NET package — but NOTHING PUBLISHED IT. This workflow stopped publishing to "
                  f"nuget.org because a trusted-publishing policy is keyed on a workflow FILENAME "
                  f"and the account's policy names dotnet.yml; the publish moved to {DOTNET_WORKFLOW} "
                  f"(integration-release-plan + publish-nuget-integration). That file's push tag "
                  f"patterns are {patterns} and none of them matches this tag, so its jobs never "
                  f"ran. Fix it one of two ways: add a pattern for this package to {DOTNET_WORKFLOW} "
                  f"(the narrow, per-package form is deliberate — see its `tags:` comment), or "
                  f"create a nuget.org policy whose Workflow file is integrations.yml and restore "
                  f"the publish-nuget job here (.github/RELEASING.md §3 has both). Nothing was "
                  f"published, so the version is unspent — re-tag once one side covers it."
              )
              sys.exit(1)

          print(
              f"::notice::{PACKAGE_NAME} {VERSION} (integrations/{SLUG}) publishes from "
