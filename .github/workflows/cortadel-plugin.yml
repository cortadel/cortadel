name: Cortadel plugin

# Runs the zero-dependency Claude Code / Codex plugin's node:test suite. The plugin moved here
# from the private engine repo's own ci.yml `plugin` job (memforge chore/move-claude-code-plugin)
# as part of open-sourcing it under a `clients` container directory (rebranded memforge-memory ->
# cortadel-memory, MEMFORGE_* -> CORTADEL_* env vars), was renamed a second time from
# claude-code-plugin/ to cortadel-plugin/ within that container (this workflow's own former
# filename, claude-code-plugin.yml) once the plugin started shipping Codex packaging too, and was
# promoted a third time straight to the repo root (cortadel-plugin/, container removed) once it
# was that container's only member — see packaging/plugin.metadata.json and
# .github/workflows/plugin-packaging.yml, which own generating and validating the manifests this
# suite's fixtures assume already exist.
#
# No install step: the plugin has zero dependencies by design (Node 18+ built-in fetch, ESM), so
# `node --test` runs directly against the checked-out scripts. Node 20 matches the private repo's
# own job (and the plugin's package-free floor); this is deliberately its own workflow file, not a
# job folded into another one — see the concurrency note below.
#
# Its own literal concurrency group, not github.job: that context is only populated inside a job's
# `steps` and is null everywhere else, including a job-level `concurrency:` block — using it there
# silently collapses every job in the file into one shared group. Documented the hard way in this
# repo's dotnet.yml/typescript.yml/python.yml header comments; avoided here the same way.

on:
  push:
    branches: [main]
    paths:
      - 'cortadel-plugin/**'
      - '.github/workflows/cortadel-plugin.yml'
  pull_request:
    paths:
      - 'cortadel-plugin/**'
      - '.github/workflows/cortadel-plugin.yml'
  workflow_dispatch:

jobs:
  test:
    name: Cortadel plugin (node --test)
    concurrency:
      group: cortadel-plugin-test-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      # Zero dependencies by design — no install step, just the built-in runner.
      - name: Test
        run: node --test cortadel-plugin/test/
