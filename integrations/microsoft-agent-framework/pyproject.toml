[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cortadel-agent-framework"
version = "0.1.0"
description = "Cortadel long-term memory for the Microsoft Agent Framework — a ContextProvider plus native memory tools."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Cortadel" }]
keywords = [
    "ai",
    "memory",
    "agents",
    "agent-framework",
    "microsoft",
    "knowledge-graph",
    "llm",
    "rag",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# agent-framework-core (not the `agent-framework` metapackage) is the right floor: it carries the
# whole extension surface this package builds on — `ContextProvider`, `SessionContext`,
# `AgentSession`, `Message`, `tool`/`FunctionTool` are all exported from the top-level
# `agent_framework` module that `agent-framework-core` installs. The `agent-framework` metapackage
# is just `agent-framework-core[all]==<same version>`, which drags in every model provider
# (Azure, Bedrock, Gemini, Anthropic, ...) that an integration has no business pinning for its users.
#
# Floor is 1.13.0 because that is the release this package is built and tested against: the
# `before_run`/`after_run` keyword-only hook pair in
# `python/packages/core/agent_framework/_sessions.py`. It is a *conservative* floor, not a hard
# compatibility boundary — those hook signatures and `SessionContext.extend_messages` are
# byte-identical at tag python-1.12.0, so the real boundary is at or below that. Do not lower the
# floor without adding a CI leg that actually runs the suite on the older release.
# Ceiling is the next major.
#
# `typing-extensions` is declared explicitly even though it only appears under `TYPE_CHECKING`
# (for `Self`, stdlib from 3.11) and even though agent-framework-core already requires it
# (>=4.15.0,<5). Depending on it transitively would make our type-checking silently depend on
# another package's dependency list; a direct import earns a direct declaration.
dependencies = [
    "agent-framework-core>=1.13.0,<2.0.0",
    "cortadel>=1.0.0,<2.0.0",
    "typing-extensions>=4.5.0",
]

[project.urls]
Homepage = "https://cortadel.ai"
Repository = "https://github.com/cortadel/cortadel"
Issues = "https://github.com/cortadel/cortadel/issues"
# PEP 621 has no `directory` key the way npm's `repository.directory` does; the Python-ecosystem
# equivalent is a Source URL resolved to this package's subdirectory in the monorepo.
Source = "https://github.com/cortadel/cortadel/tree/main/integrations/microsoft-agent-framework"

[tool.hatch.build.targets.wheel]
packages = ["cortadel_agent_framework"]

[tool.hatch.build.targets.sdist]
include = [
    "cortadel_agent_framework/**/*.py",
    "cortadel_agent_framework/py.typed",
    "README.md",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    # Not a runtime dependency — a *test* one. `tests/test_examples.py` binds the chat-client
    # construction in the README quickstart and the example script against the real
    # `OpenAIChatClient.__init__` signature, which is how a wrong kwarg gets caught before it
    # ships. `inspect.signature(...).bind_partial` constructs nothing, so this still needs no
    # network and no API key at test time. Cheap: it adds the `openai` SDK and four small wheels.
    "agent-framework-openai>=1.12.0,<2.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "error",
]
