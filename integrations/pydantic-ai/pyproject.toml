[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cortadel-pydantic-ai"
version = "0.1.0"
description = "Cortadel long-term graph memory as a native Pydantic AI capability — memory tools plus automatic recall and persistence."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Cortadel" }]
keywords = ["ai", "memory", "agents", "pydantic-ai", "knowledge-graph", "llm", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# `pydantic-ai-slim` rather than `pydantic-ai`: this is a library, so the application picks its own
# model-provider extras (`pydantic-ai-slim[openai]`, `[anthropic]`, …) instead of inheriting the
# full meta-package's provider set. Installing `pydantic-ai` also satisfies this floor, because
# `pydantic-ai==X` depends on `pydantic-ai-slim==X`.
#
# Floor is 2.29.0: the capability system this package is built on
# (`pydantic_ai.capabilities.AbstractCapability`, and `Agent(capabilities=[...])`) is what the
# integration plugs into, and `AbstractCapability.get_instructions()` / `for_run()` / `after_run()`
# are the exact hooks used. `<3.0.0` because pydantic-ai follows semver for its public surface.
dependencies = [
    "cortadel>=1.0.0,<2.0.0",
    "pydantic-ai-slim>=2.29.0,<3.0.0",
]

[project.urls]
Homepage = "https://cortadel.ai"
Repository = "https://github.com/cortadel/cortadel"
Source = "https://github.com/cortadel/cortadel/tree/main/integrations/pydantic-ai"
Issues = "https://github.com/cortadel/cortadel/issues"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

# The build backend, carried here so uv.lock resolves it instead of the index. CI installs this
# group and then builds with --no-build-isolation; without it, building the editable wheel creates
# an isolated build environment and resolves the backend straight from PyPI on every run, unpinned
# and lock-free. Measured, not assumed — `uv pip install --no-deps --no-build -e . -v --refresh`
# logs "Adding direct dependency: hatchling*", "Sending revalidation request for:
# https://pypi.org/simple/hatchling/", and installs eight packages at whatever versions are newest
# that day. That is what SonarCloud githubactions:S8544 flags on the install step, and it is a true
# positive.
#
# `editables` is listed even though `[build-system] requires` does not mention it, and that was
# found by running the build rather than by reading the manifest: hatchling asks for it at build
# time through PEP 517's dynamic `get_requires_for_build_editable()` hook ("Adding direct
# dependency: editables>=0.3, <1.dev0"), which it returns only for *editable* wheels. Build
# isolation used to satisfy that hook silently; --no-build-isolation does not, so omitting it here
# fails the install step with "ModuleNotFoundError: No module named 'editables'". The remaining six
# (packaging, pathspec, pluggy, tomli, tomlkit, trove-classifiers) are hatchling's own dependencies
# and come in transitively.
#
# A PEP 735 dependency group rather than an extra: groups are local development metadata and never
# reach the built wheel or sdist, so a consumer running `pip install cortadel-pydantic-ai[test]` is
# unaffected and no new public install option is added. Versions and hashes live in uv.lock — re-run
# `uv lock` after touching this group or `[build-system] requires`.
[dependency-groups]
build = [
    "hatchling",
    "editables",
]

[tool.hatch.build.targets.wheel]
packages = ["cortadel_pydantic_ai"]

[tool.hatch.build.targets.sdist]
include = [
    "cortadel_pydantic_ai/**/*.py",
    "cortadel_pydantic_ai/py.typed",
    "README.md",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "error",
]
