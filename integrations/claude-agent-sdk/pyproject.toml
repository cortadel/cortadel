[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cortadel-claude-agent-sdk"
version = "0.1.0"
description = "Cortadel long-term memory for the Claude Agent SDK — in-process memory tools plus automatic recall/capture hooks."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Cortadel" }]
keywords = ["ai", "memory", "agents", "claude", "claude-agent-sdk", "mcp", "knowledge-graph", "llm", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# claude-agent-sdk: floor 0.2.0 — this package was developed and its whole surface verified
# against 0.2.137. Everything it touches (`tool`, `create_sdk_mcp_server`, `ToolAnnotations`,
# `ClaudeAgentOptions`, `HookMatcher`) has been stable across 0.2.x. The one genuinely recent
# API it uses, `get_session_messages`, is imported defensively in `_transcript.py` with a
# JSONL fallback, so an older 0.2.x still works.
# anyio: already a hard dependency of claude-agent-sdk, declared here because `_memory.py`
# imports it directly for `fail_after` (backend-neutral per-call timeouts).
dependencies = [
    "cortadel>=1.0.0,<2.0.0",
    "claude-agent-sdk>=0.2.0,<0.3.0",
    "anyio>=4.0.0",
]

[project.urls]
Homepage = "https://cortadel.ai"
Repository = "https://github.com/cortadel/cortadel"
Source = "https://github.com/cortadel/cortadel/tree/main/integrations/claude-agent-sdk"
Issues = "https://github.com/cortadel/cortadel/issues"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["cortadel_claude_agent_sdk"]

[tool.hatch.build.targets.sdist]
include = [
    "cortadel_claude_agent_sdk/**/*.py",
    "cortadel_claude_agent_sdk/py.typed",
    "README.md",
    "LICENSE",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
